<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<title>Dozenten Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>Dozenten Dashboard</h1>
    <div class="header-actions">
      <button id="exportDataBtn" class="btn-header" title="Alle Daten als JSON-Datei exportieren">Daten exportieren</button>
      <button id="deleteAllDataBtn" class="btn-header danger" title="Alle Dozenten und Daten unwiderruflich löschen">Alle Daten löschen</button>
    </div>
  </header>

  <nav class="dozent-tabs" id="dozentTabs">
    <!-- Dozenten-Tabs werden hier eingefügt -->
  </nav>

  <main id="content">
    <div class="empty-state" id="emptyState">
      <p>Noch keine Dozenten angelegt.</p>
      <button id="addDozentEmptyBtn" class="btn-primary">+ Dozent hinzufügen</button>
    </div>
  </main>

  <!-- Modal: Dozent hinzufügen -->
  <div class="modal-overlay" id="addDozentModal">
    <div class="modal">
      <h2>Neuen Dozenten hinzufügen</h2>
      <input type="text" id="newDozentName" placeholder="Name des Dozenten" maxlength="60">
      <div class="modal-actions">
        <button id="cancelAddDozent" class="btn-secondary">Abbrechen</button>
        <button id="confirmAddDozent" class="btn-primary">Hinzufügen</button>
      </div>
    </div>
  </div>

  <!-- Modal: Dozent löschen bestätigen -->
  <div class="modal-overlay" id="deleteDozentModal">
    <div class="modal">
      <h2>Dozenten entfernen?</h2>
      <p id="deleteDozentText"></p>
      <div class="modal-actions">
        <button id="cancelDeleteDozent" class="btn-secondary">Abbrechen</button>
        <button id="confirmDeleteDozent" class="btn-danger">Entfernen</button>
      </div>
    </div>
  </div>

  <!-- Modal: Alle Daten löschen bestätigen (DSGVO-Löschung) -->
  <div class="modal-overlay" id="deleteAllDataModal">
    <div class="modal">
      <h2>Wirklich alle Daten löschen?</h2>
      <p>Alle Dozenten, Listen und Chat-Nachrichten werden unwiderruflich gelöscht. Tipp: Vorher über „Daten exportieren" sichern.</p>
      <div class="modal-actions">
        <button id="cancelDeleteAllData" class="btn-secondary">Abbrechen</button>
        <button id="confirmDeleteAllData" class="btn-danger">Endgültig löschen</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
