<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dozenten Dashboard</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#0b1f4d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dozenten Dashboard">
</head>
<body>
  <header class="app-header">
    <h1>Dozenten Dashboard</h1>
    <a class="app-nav-link" href="tagesreport.html">Baustelle Tagesreport →</a>
  </header>

  <nav class="dozent-tabs" id="dozentTabs">
    <!-- Dozenten-Tabs werden hier eingefügt -->
  </nav>

  <main id="content">
    <div class="empty-state" id="emptyState">
      <p>Noch keine Dozenten angelegt.</p>
      <button id="addDozentEmptyBtn" class="btn-primary">+ Dozent hinzufügen</button>
    </div>
  </main>

  <!-- Modal: Dozent hinzufügen -->
  <div class="modal-overlay" id="addDozentModal">
    <div class="modal">
      <h2>Neuen Dozenten hinzufügen</h2>
      <input type="text" id="newDozentName" placeholder="Name des Dozenten" maxlength="60">
      <div class="modal-actions">
        <button id="cancelAddDozent" class="btn-secondary">Abbrechen</button>
        <button id="confirmAddDozent" class="btn-primary">Hinzufügen</button>
      </div>
    </div>
  </div>

  <!-- Modal: Dozent löschen bestätigen -->
  <div class="modal-overlay" id="deleteDozentModal">
    <div class="modal">
      <h2>Dozenten entfernen?</h2>
      <p id="deleteDozentText"></p>
      <div class="modal-actions">
        <button id="cancelDeleteDozent" class="btn-secondary">Abbrechen</button>
        <button id="confirmDeleteDozent" class="btn-danger">Entfernen</button>
      </div>
    </div>
  </div>

  <script src="platform-bridge.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
