buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// react-native-background-actions calls the ServiceCompat.startForeground(...)
// overload that takes a foregroundServiceType, added in androidx.core 1.12.0.
// Each Gradle subproject (this one included) resolves its own compile
// classpath independently, so declaring the version in just one module's
// dependencies (e.g. :app) does NOT affect another module's own compile
// task — it must be forced for every subproject here at the root.
allprojects {
    configurations.all {
        resolutionStrategy {
            force "androidx.core:core:1.13.1"
            force "androidx.core:core-ktx:1.13.1"
        }
    }
}
