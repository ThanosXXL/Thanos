<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Trading Agent Dashboard</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1420;
    --panel: #171d2b;
    --border: #2a3245;
    --text: #e6e9f0;
    --muted: #8891a7;
    --green: #35c98c;
    --red: #ef5a5a;
    --warn: #f5a623;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
  .banner {
    background: #3a2a10;
    border: 1px solid var(--warn);
    color: #ffd48a;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  .banner.live {
    background: #3a1414;
    border-color: var(--red);
    color: #ffb3b3;
    font-weight: 600;
  }
  .cards { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    min-width: 160px;
  }
  .card .label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .card .value { font-size: 1.4rem; font-weight: 600; margin-top: 4px; }
  .value.pos { color: var(--green); }
  .value.neg { color: var(--red); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { padding: 8px 12px; text-align: left; font-size: 0.85rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  tr:last-child td { border-bottom: none; }
  section { margin-bottom: 28px; }
  section h2 { font-size: 0.95rem; margin-bottom: 8px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 0.85rem; padding: 12px; }
</style>
</head>
<body>
  <h1>Trading Agent Dashboard</h1>
  <div class="subtitle" id="subtitle">lädt...</div>
  <div id="banner" class="banner" style="display:none"></div>

  <div class="cards">
    <div class="card"><div class="label">Modus</div><div class="value" id="mode">–</div></div>
    <div class="card"><div class="label">Kontostand</div><div class="value" id="balance">–</div></div>
    <div class="card"><div class="label">Realisierter Gewinn/Verlust</div><div class="value" id="pnl">–</div></div>
    <div class="card"><div class="label">Offene Positionen</div><div class="value" id="openCount">–</div></div>
  </div>

  <section>
    <h2>Offene Positionen</h2>
    <div id="openPositions"></div>
  </section>

  <section>
    <h2>Letzte Trades</h2>
    <div id="tradeLog"></div>
  </section>

  <script>
    function fmt(n) {
      return typeof n === 'number' ? n.toFixed(2) : '–';
    }

    async function refresh() {
      const res = await fetch('/api/status');
      const data = await res.json();

      document.getElementById('subtitle').textContent =
        `${data.symbol} · ${data.interval} · zuletzt aktualisiert: ${data.updatedAt || '–'}`;

      const banner = document.getElementById('banner');
      if (data.mode === 'live') {
        banner.style.display = 'block';
        banner.className = 'banner live';
        banner.textContent = 'LIVE-MODUS: Es werden echte Orders mit echtem Geld ausgeführt. Kein Gewinn ist garantiert, Verluste sind jederzeit möglich.';
      } else if (data.mode === 'testnet') {
        banner.style.display = 'block';
        banner.className = 'banner';
        banner.textContent = 'TESTNET-MODUS: Orders laufen gegen Binance Spot Testnet mit fiktivem Guthaben.';
      } else {
        banner.style.display = 'block';
        banner.className = 'banner';
        banner.textContent = 'PAPER-MODUS: Es werden keine echten Orders gesendet, alle Fills sind simuliert.';
      }

      document.getElementById('mode').textContent = data.mode.toUpperCase();
      document.getElementById('balance').textContent = fmt(data.balance);

      const pnlEl = document.getElementById('pnl');
      pnlEl.textContent = fmt(data.realizedPnl);
      pnlEl.className = 'value ' + (data.realizedPnl > 0 ? 'pos' : data.realizedPnl < 0 ? 'neg' : '');

      document.getElementById('openCount').textContent = data.openPositions.length;

      const openWrap = document.getElementById('openPositions');
      if (data.openPositions.length === 0) {
        openWrap.innerHTML = '<div class="empty">Keine offenen Positionen.</div>';
      } else {
        openWrap.innerHTML = renderTable(
          ['Seite', 'Menge', 'Einstieg', 'Stop-Loss', 'Take-Profit', 'Eröffnet'],
          data.openPositions.map((p) => [p.side, p.quantity, fmt(p.entryPrice), fmt(p.stopLoss), fmt(p.takeProfit), p.openTime])
        );
      }

      const tradeWrap = document.getElementById('tradeLog');
      if (data.trades.length === 0) {
        tradeWrap.innerHTML = '<div class="empty">Noch keine abgeschlossenen Trades.</div>';
      } else {
        tradeWrap.innerHTML = renderTable(
          ['Seite', 'Menge', 'Einstieg', 'Ausstieg', 'Grund', 'P&L', 'Geschlossen'],
          data.trades.map((t) => [
            t.side,
            t.quantity,
            fmt(t.entryPrice),
            fmt(t.exitPrice),
            t.reason,
            fmt(t.pnl),
            t.exitTime,
          ])
        );
      }
    }

    function renderTable(headers, rows) {
      const thead = `<tr>${headers.map((h) => `<th>${h}</th>`).join('')}</tr>`;
      const tbody = rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('');
      return `<table><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
