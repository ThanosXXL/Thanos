<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#2a2a32"/>
      <stop offset="100%" stop-color="#0b0b0f"/>
    </radialGradient>
    <linearGradient id="ink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4d9ff"/>
      <stop offset="50%" stop-color="#a678c9"/>
      <stop offset="100%" stop-color="#4a2b63"/>
    </linearGradient>
    <filter id="gloss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feSpecularLighting in="b" surfaceScale="4" specularConstant="0.9" specularExponent="18" lighting-color="#fff" result="s">
        <fePointLight x="120" y="60" z="150"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
      <feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <g filter="url(#gloss)" fill="none" stroke="url(#ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="200" cy="200" r="130"/>
    <circle cx="200" cy="200" r="95"/>
    <circle cx="200" cy="200" r="60"/>
    <circle cx="200" cy="200" r="14"/>
    <g id="petals">
      <path d="M200 70 L 210 105 L 200 140 L 190 105 Z"/>
    </g>
    <use href="#petals" transform="rotate(30 200 200)"/>
    <use href="#petals" transform="rotate(60 200 200)"/>
    <use href="#petals" transform="rotate(90 200 200)"/>
    <use href="#petals" transform="rotate(120 200 200)"/>
    <use href="#petals" transform="rotate(150 200 200)"/>
    <use href="#petals" transform="rotate(180 200 200)"/>
    <use href="#petals" transform="rotate(210 200 200)"/>
    <use href="#petals" transform="rotate(240 200 200)"/>
    <use href="#petals" transform="rotate(270 200 200)"/>
    <use href="#petals" transform="rotate(300 200 200)"/>
    <use href="#petals" transform="rotate(330 200 200)"/>
  </g>
</svg>
