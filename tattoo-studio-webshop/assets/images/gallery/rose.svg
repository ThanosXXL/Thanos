<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bgRose" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#2a2a32"/>
      <stop offset="100%" stop-color="#0b0b0f"/>
    </radialGradient>
    <linearGradient id="inkRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe9c7"/>
      <stop offset="45%" stop-color="#c9a24b"/>
      <stop offset="100%" stop-color="#5c3d13"/>
    </linearGradient>
    <filter id="glossRose" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feSpecularLighting in="b" surfaceScale="4" specularConstant="0.9" specularExponent="18" lighting-color="#fff" result="s">
        <fePointLight x="120" y="60" z="150"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
      <feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgRose)"/>
  <g filter="url(#glossRose)" fill="none" stroke="url(#inkRose)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M200 300 C 150 260, 140 190, 200 150 C 260 190, 250 260, 200 300 Z"/>
    <path d="M200 150 C 170 130, 165 95, 200 70 C 235 95, 230 130, 200 150 Z"/>
    <path d="M170 175 C 140 160, 120 175, 110 200"/>
    <path d="M230 175 C 260 160, 280 175, 290 200"/>
    <path d="M200 300 C 195 330, 205 355, 200 380"/>
    <path d="M200 330 C 175 320, 160 330, 150 345"/>
    <path d="M200 340 C 225 330, 240 340, 250 355"/>
    <path d="M165 210 Q 200 225 235 210"/>
    <path d="M175 180 Q 200 195 225 180"/>
  </g>
</svg>
