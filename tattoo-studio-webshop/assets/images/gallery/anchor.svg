<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#2a2a32"/>
      <stop offset="100%" stop-color="#0b0b0f"/>
    </radialGradient>
    <linearGradient id="ink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dff1ff"/>
      <stop offset="50%" stop-color="#4f8fc9"/>
      <stop offset="100%" stop-color="#1c3a57"/>
    </linearGradient>
    <filter id="gloss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feSpecularLighting in="b" surfaceScale="4" specularConstant="0.9" specularExponent="18" lighting-color="#fff" result="s">
        <fePointLight x="120" y="60" z="150"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
      <feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <g filter="url(#gloss)" fill="none" stroke="url(#ink)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="200" cy="110" r="22"/>
    <line x1="200" y1="132" x2="200" y2="290"/>
    <line x1="150" y1="160" x2="250" y2="160"/>
    <path d="M130 200 C 130 250, 160 285, 200 295"/>
    <path d="M270 200 C 270 250, 240 285, 200 295"/>
    <path d="M110 200 L 150 200 M 250 200 L 290 200"/>
    <path d="M175 240 C 160 260, 120 270, 100 320 C 140 320, 170 300, 190 275"/>
    <path d="M225 240 C 240 260, 280 270, 300 320 C 260 320, 230 300, 210 275"/>
  </g>
</svg>
