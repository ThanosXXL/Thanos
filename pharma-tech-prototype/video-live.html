*{margin:0;padding:0;box-sizing:border-box;}
html,body{ width:1440px; height:900px; overflow:hidden; }
body{
  background:
    radial-gradient(120% 90% at 82% 8%, rgba(255,255,255,0.9), transparent 45%),
    linear-gradient(150deg, #EAFBF3 0%, #F7FEFB 40%, #ffffff 100%);
  font-family:'Manrope', sans-serif;
  position:relative;
}
canvas.hero{ position:absolute; top:-60px; right:-80px; width:720px; height:720px; }
.center{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.logo-row{ display:flex; align-items:center; gap:22px; opacity:0; transform:translateY(16px); animation: fadeUp .6s ease forwards; }
.logo{
  width:96px;height:96px;border-radius:28px;
  background:linear-gradient(155deg, #ffffff 0%, #7FE0C3 55%, #0EA37D 100%);
  box-shadow: inset 0 2px 2px rgba(255,255,255,0.95), inset 0 -14px 20px rgba(6,60,45,0.35), 0 18px 32px rgba(6,60,45,0.3);
  display:flex;align-items:center;justify-content:center;
}
.logo svg{ width:50px;height:50px; }
.wordmark{ font-family:'Baloo 2'; font-weight:800; font-size:56px; color:#0A5C46; }
.tagline{
  margin-top:26px; font-family:'Baloo 2'; font-weight:700; font-size:30px; color:#0A2A20;
  opacity:0; transform:translateY(14px); animation: fadeUp .6s ease forwards .4s;
  text-align:center; max-width:760px;
}
@keyframes fadeUp{ to{ opacity:1; transform:translateY(0); } }

.shine{
  position:absolute; inset:-40% -120%; pointer-events:none;
  background:linear-gradient(100deg, transparent 40%, rgba(255,255,255,0.85) 48%, rgba(255,255,255,0.15) 52%, transparent 62%);
  transform:translateX(-70%);
  animation: sweep 2.4s ease-in-out forwards .5s;
  mix-blend-mode:overlay;
}
@keyframes sweep{ 0%{ transform:translateX(-70%);} 100%{ transform:translateX(70%);} }
.logo{ position:relative; overflow:hidden; }

.live-wrap{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; }
.brand-row-sm{ display:flex; align-items:center; gap:14px; opacity:0; transform:translateY(14px); animation: fadeUp .6s ease forwards; }
.brand-row-sm .logo{ width:52px; height:52px; border-radius:16px; }
.brand-row-sm .logo svg{ width:28px; height:28px; }
.brand-row-sm .wordmark{ font-size:26px; }
.live-headline{
  margin-top:22px; font-family:'Baloo 2'; font-weight:800; font-size:42px; color:#0A2A20; text-align:center;
  opacity:0; transform:translateY(14px); animation: fadeUp .6s ease forwards .25s;
}
.live-badge{
  margin-top:16px; display:inline-flex; align-items:center; gap:10px;
  background:#ffffff; border-radius:999px; padding:10px 22px;
  box-shadow: 0 10px 22px rgba(6,60,45,0.25);
  font-family:'Baloo 2'; font-weight:700; font-size:20px; color:#0A5C46;
  opacity:0; transform:translateY(14px); animation: fadeUp .6s ease forwards .45s;
}
.rec-dot{ width:13px; height:13px; border-radius:99px; background:#e23b3b; animation: recPulse 1.1s ease infinite; }
@keyframes recPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.25; } }
.device-frame{
  margin-top:22px; width:780px; height:517px; border-radius:30px; padding:14px;
  background:linear-gradient(155deg, #163229 0%, #0A2018 100%);
  box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 -14px 26px rgba(0,0,0,0.45) inset, 0 30px 54px rgba(3,20,14,0.45);
  position:relative;
  opacity:0; transform:translateY(18px) scale(.98); animation: fadeUp .7s ease forwards .6s;
}

<script>
function drawPill(ctx, cx, cy, len, rad, angle, colorTop, colorBot){
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle);
  ctx.save(); ctx.translate(rad*0.5, rad*0.9);
  ctx.fillStyle = 'rgba(3,20,14,0.3)';
  roundedCapsulePath(ctx, len, rad); ctx.filter = 'blur(14px)'; ctx.fill(); ctx.restore();
  const grad = ctx.createLinearGradient(-len/2, 0, len/2, 0);
  grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.5, '#ffffff');
  grad.addColorStop(0.501, colorTop); grad.addColorStop(1, colorBot);
  ctx.fillStyle = grad; roundedCapsulePath(ctx, len, rad); ctx.fill();
  const shade = ctx.createLinearGradient(0, -rad, 0, rad);
  shade.addColorStop(0, 'rgba(255,255,255,0.75)'); shade.addColorStop(0.28, 'rgba(255,255,255,0.12)');
  shade.addColorStop(0.55, 'rgba(0,0,0,0)'); shade.addColorStop(1, 'rgba(0,20,14,0.38)');
  ctx.fillStyle = shade; roundedCapsulePath(ctx, len, rad); ctx.fill();
  ctx.strokeStyle = 'rgba(0,30,22,0.18)'; ctx.lineWidth = rad*0.05;
  ctx.beginPath(); ctx.moveTo(0, -rad*0.96); ctx.lineTo(0, rad*0.96); ctx.stroke();
  const spec = ctx.createLinearGradient(0, -rad, 0, 0);
  spec.addColorStop(0, 'rgba(255,255,255,0.9)'); spec.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = spec;
  ctx.beginPath(); ctx.ellipse(-len*0.16, -rad*0.42, len*0.30, rad*0.30, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(len*0.30, -rad*0.40, len*0.14, rad*0.22, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
function roundedCapsulePath(ctx, len, rad){
  ctx.beginPath();
  ctx.moveTo(-len/2 + rad, -rad); ctx.lineTo(len/2 - rad, -rad);
  ctx.arc(len/2 - rad, 0, rad, -Math.PI/2, Math.PI/2);
  ctx.lineTo(-len/2 + rad, rad);
  ctx.arc(-len/2 + rad, 0, rad, Math.PI/2, Math.PI*1.5);
  ctx.closePath();
}
