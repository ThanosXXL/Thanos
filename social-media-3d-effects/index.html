<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M&C Akademie – Zertifikatsverleihung</title>
<meta name="description" content="Animierte Social-Media-Grafik im 3D- und Hochglanz-Look: erfolgreiche Teilnehmer nehmen ihr M&C Akademie Zertifikat entgegen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Manrope:wght@400;600;800&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0b090d;
    --bg-1:#1c0f13;
    --bg-2:#2c1319;
    --red:#d81f1a;
    --red-bright:#ff5643;
    --red-deep:#7a1512;
    --gold:#f0c669;
    --gold-soft:#fde9ba;
    --gold-deep:#a9782f;
    --paper:#faf5ea;
    --ink:#241a17;
    --text-0:#f8f2e8;
    --text-1:#cdbfb2;
    --text-2:#8f8078;
    --glass-fill:rgba(255,255,255,0.07);
    --glass-fill-strong:rgba(255,255,255,0.14);
    --glass-border:rgba(255,255,255,0.20);
    --font-display:"Unbounded", "Segoe UI", system-ui, sans-serif;
    --font-body:"Manrope", "Segoe UI", system-ui, sans-serif;
    --font-serif:"Playfair Display", Georgia, "Times New Roman", serif;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 18% -10%, #3a151b 0%, transparent 45%),
      radial-gradient(circle at 100% 110%, #26121a 0%, transparent 50%),
      var(--bg-0);
    color:var(--text-0);
    font-family:var(--font-body);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1.3em;
    padding:5vh 4vw;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }

  /* ---------- POST CANVAS ---------- */
  .post{
    position:relative;
    width:min(94vw, 560px);
    /* Höhe ergibt sich aus dem Inhalt (siehe .scene-wrap) statt aus
       aspect-ratio, damit Vorschau-Browser ohne aspect-ratio-Unterstützung
       die Karte nicht auf 0 Höhe kollabieren lassen. */
    font-size:clamp(13px, 3vw, 17px);
    border-radius:1.6em;
    overflow:hidden;
    background:
      linear-gradient(155deg, var(--bg-2) 0%, var(--bg-1) 45%, var(--bg-0) 100%);
    box-shadow:
      0 2px 0 rgba(255,255,255,0.06) inset,
      0 40px 90px -25px rgba(0,0,0,0.75),
      0 10px 30px -10px rgba(216,31,26,0.25);
    display:flex;
    flex-direction:column;
    padding:1.5em 1.5em 1.8em;
    perspective:1200px;
    isolation:isolate;
    will-change:transform;
    transition:transform .25s ease-out;
  }

  .post::before{
    /* subtle vignette + grain-free texture */
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(120% 70% at 50% 8%, rgba(255,255,255,0.05), transparent 60%),
      radial-gradient(90% 60% at 50% 100%, rgba(0,0,0,0.55), transparent 55%);
    pointer-events:none;
    z-index:1;
  }

  /* rotating conic light sweep, very low opacity for ambient depth */
  .post-aurora{
    position:absolute;
    inset:-30% -30%;
    background:conic-gradient(from 0deg, transparent 0deg, rgba(216,31,26,0.16) 40deg, transparent 100deg, rgba(240,198,105,0.10) 190deg, transparent 260deg);
    animation:spin 26s linear infinite;
    mix-blend-mode:screen;
    z-index:0;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* Diagonaler Hochglanz-Sweep über die gesamte Karte (3D-Glaseffekt) */
  .post-shine{
    position:absolute;
    top:-70%; left:-60%;
    width:35%; height:240%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.16), transparent);
    transform:rotate(16deg);
    animation:cardShine 8s ease-in-out infinite;
    pointer-events:none;
    mix-blend-mode:screen;
    z-index:4;
  }
  @keyframes cardShine{
    0%{ left:-60%; }
    35%,100%{ left:140%; }
  }

  /* ---------- HEADER ---------- */
  .post-header{
    position:relative; z-index:3;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:0.6em;
    animation:enter .7s cubic-bezier(.2,.8,.2,1) both;
  }

  .logo-badge{
    flex:none;
    width:8.4em; height:8.4em;
    margin:-1em 0 -1em -0.5em;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    animation:badgeFloat 5.5s ease-in-out infinite;
  }
  .logo-badge img{
    /* Echtes freigestelltes PNG (transparenter Hintergrund) statt
       CSS-Blend-Trick – funktioniert in jedem Browser/WebView zuverlässig. */
    width:100%; height:100%; object-fit:contain;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,0.45));
  }
  @keyframes badgeFloat{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-0.15em); }
  }
  @keyframes shine{
    0%{ left:-60%; }
    35%,100%{ left:130%; }
  }

  .eyebrow-chip{
    flex:none;
    font-family:var(--font-body);
    font-weight:800;
    font-size:0.58em;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--gold-soft);
    background:linear-gradient(155deg, rgba(216,31,26,0.35), rgba(20,10,12,0.35));
    border:1px solid rgba(240,198,105,0.35);
    padding:0.75em 1em;
    border-radius:2em;
    backdrop-filter:blur(6px);
    text-align:right;
    line-height:1.5;
    box-shadow:0 4px 14px -6px rgba(0,0,0,0.5);
  }

  /* ---------- SCENE ---------- */
  .scene-wrap{
    position:relative; z-index:2;
    /* Feste em-Höhe statt flex:1-auto-aus-aspect-ratio: manche eingebetteten
       Vorschau-Browser (z. B. In-App-Dateivorschauen) unterstützen
       `aspect-ratio` nicht, wodurch .post keine Höhe hätte und dieser
       Bereich (und damit Zertifikat/Figuren) auf 0px kollabieren würde. */
    height:16em;
    margin-top:0.4em;
  }
  .scene{
    position:absolute; inset:0;
    perspective:900px;
  }

  .spotlight{
    position:absolute;
    left:50%; top:-15%;
    width:150%; height:130%;
    transform:translateX(-50%);
    background:conic-gradient(from 180deg at 50% 0%, transparent 34%, rgba(255,244,214,0.16) 50%, transparent 66%);
    animation:sweep 7s ease-in-out infinite;
    pointer-events:none;
    mix-blend-mode:screen;
  }
  @keyframes sweep{
    0%,100%{ transform:translateX(-50%) rotate(-6deg); }
    50%{ transform:translateX(-50%) rotate(6deg); }
  }

  .confetti-layer{ position:absolute; inset:0; overflow:hidden; }
  .confetto{
    position:absolute;
    top:-10%;
    left:var(--x);
    width:var(--s); height:calc(var(--s) * 2.6);
    background:var(--c);
    border-radius:1px;
    opacity:0.9;
    animation:fall var(--dur) linear var(--delay) infinite;
    box-shadow:0 0 4px rgba(0,0,0,0.15);
  }
  @keyframes fall{
    0%{ transform:translateY(-10%) rotate(0deg); opacity:0; }
    8%{ opacity:0.95; }
    100%{ transform:translateY(650%) rotate(540deg); opacity:0; }
  }

  .cast{
    position:absolute;
    left:50%; bottom:12%;
    transform:translateX(-50%);
    transform-style:preserve-3d;
    width:92%;
    height:78%;
    animation:castEnter .9s .15s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes castEnter{
    from{ opacity:0; transform:translateX(-50%) translateY(0.8em) scale(0.97); }
    to{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
  }
  .reflection{
    position:absolute;
    left:50%; bottom:-2%;
    transform:translateX(-50%) scaleY(-1);
    width:92%;
    height:46%;
    -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,0.38), transparent 75%);
    mask-image:linear-gradient(to bottom, rgba(0,0,0,0.38), transparent 75%);
    filter:blur(1.5px);
    opacity:0.55;
    pointer-events:none;
  }

  .stage-floor{
    position:absolute;
    left:8%; right:8%; bottom:8%;
    height:0.5em;
    border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(240,198,105,0.35), transparent 70%);
    filter:blur(2px);
  }

  .group{ position:relative; width:100%; height:100%; }

  .figure{
    position:absolute;
    bottom:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    animation:bob 4.2s ease-in-out infinite;
  }
  .figure--left{ left:4%; height:88%; animation-delay:.2s; }
  .figure--right{ right:4%; height:88%; animation-delay:.6s; }
  .figure--center{ left:50%; height:98%; transform:translateX(-50%); z-index:2; animation-delay:0s; }

  @keyframes bob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-0.22em); }
  }
  .figure--center{ animation-name:bobCenter; }
  @keyframes bobCenter{
    0%,100%{ transform:translateX(-50%) translateY(0); }
    50%{ transform:translateX(-50%) translateY(-0.28em); }
  }

  .human-figure{
    position:relative;
    display:block;
    height:100%;
    width:auto;
    overflow:visible;
    filter:drop-shadow(0 10px 12px rgba(0,0,0,0.4));
  }
  .arm{
    transform-box:fill-box;
    transform-origin:50% 8%;
  }
  .arm.l{ transform:rotate(var(--rl, -14deg)); }
  .arm.r{ transform:rotate(var(--rr, 14deg)); }
  .figure--center .arm.l{ --rl:-38deg; }
  .figure--center .arm.r{ --rr:38deg; }
  .figure--left .arm.r{ --rr:170deg; animation:cheer 2.4s ease-in-out infinite; }
  .figure--right .arm.l{ --rl:-170deg; animation:cheer 2.4s ease-in-out infinite reverse; }
  @keyframes cheer{
    0%,100%{ transform:rotate(var(--rr, var(--rl))); }
    50%{ transform:rotate(calc(var(--rr, var(--rl)) - 10deg)); }
  }

  /* ---------- CERTIFICATE LOOP (real-time rotating carousel) ---------- */
  .cert-loop{
    position:absolute;
    left:50%; top:27%;
    width:86%;
    aspect-ratio:0.68/1;
    transform:translateX(-50%) rotateZ(-6deg) rotateY(3deg);
    animation:certWobble 6s ease-in-out infinite;
    z-index:3;
  }
  @keyframes certWobble{
    0%,100%{ transform:translateX(-50%) rotateZ(-6deg) rotateY(3deg); }
    50%{ transform:translateX(-50%) rotateZ(-3deg) rotateY(-1.5deg); }
  }
  .cert-slide{
    position:absolute; inset:0;
    opacity:0;
    transform:rotateY(-46deg);
    transition:opacity .8s ease, transform .8s ease;
    pointer-events:none;
  }
  .cert-slide.is-active{
    opacity:1;
    transform:rotateY(0deg);
    pointer-events:auto;
  }
  .cert-card{
    position:absolute; inset:0;
    background:linear-gradient(155deg, #fffdf7, var(--paper) 55%, #ece2cc 100%);
    border-radius:0.3em;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.8) inset,
      0 14px 26px -8px rgba(0,0,0,0.55),
      0 0 0 1px rgba(0,0,0,0.15);
    overflow:hidden;
  }
  .cert-card::after{
    content:"";
    position:absolute; top:-80%; left:-40%;
    width:40%; height:260%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.85), transparent);
    transform:rotate(18deg);
    animation:shine 3.6s ease-in-out infinite;
    animation-delay:.4s;
  }
  .cert-border{
    position:absolute; inset:0.16em;
    border:1.5px solid var(--gold-deep);
    outline:0.5px solid var(--gold);
    outline-offset:2px;
    border-radius:0.2em;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center;
    gap:0.16em;
    padding:0.3em 0.25em;
    text-align:center;
    overflow:hidden;
  }
  .cert-border > *{ flex-shrink:0; margin:0 !important; }
  .cert-seal{
    width:18%; aspect-ratio:1/1;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 55%, var(--gold-deep) 100%);
    box-shadow:0 3px 8px rgba(0,0,0,0.35), 0 0 0 0.07em rgba(255,255,255,0.6) inset;
    position:relative;
    flex:none;
  }
  .cert-seal::after{
    content:"✓";
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color:#5c3d0c;
    font-weight:800;
    font-size:0.5em;
    font-family:var(--font-body);
  }
  .cert-kicker{
    font-family:var(--font-body); font-weight:800;
    font-size:0.26em; letter-spacing:0.1em;
    color:var(--gold-deep);
    white-space:nowrap;
  }
  .cert-title{
    font-family:var(--font-serif);
    font-weight:700;
    font-size:0.58em;
    letter-spacing:0.05em;
    color:var(--ink);
  }
  .cert-sub{
    font-family:var(--font-body);
    font-size:0.24em;
    color:var(--text-2);
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .cert-name{
    font-family:var(--font-serif);
    font-style:italic; font-weight:600;
    font-size:0.29em;
    color:var(--red-deep);
    padding-bottom:0.1em;
    border-bottom:1px solid var(--gold);
    width:100%;
    box-sizing:border-box;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .cert-course{
    font-family:var(--font-body); font-weight:600;
    font-size:0.23em; color:var(--ink);
    padding:0 0.2em;
    width:100%;
    box-sizing:border-box;
    overflow-wrap:break-word;
    word-break:break-word;
    hyphens:auto;
  }
  .cert-meta{
    font-family:var(--font-body);
    font-size:0.19em; color:var(--text-2);
    display:flex; gap:0.4em; align-items:center;
    font-variant-numeric:tabular-nums;
  }
  .cert-sig-row{
    display:flex; justify-content:space-between;
    width:94%; margin-top:0.2em !important; padding-top:0.2em;
  }
  .cert-sig{
    font-family:var(--font-body);
    font-size:0.17em; color:var(--text-2);
    display:flex; flex-direction:column; align-items:center; gap:0.2em;
  }
  .cert-sig .line{ width:2.4em; height:1px; background:var(--text-2); display:block; }
  .cert-photo{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    border-radius:0.3em;
    border:0.14em solid var(--gold);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.8) inset,
      0 14px 26px -8px rgba(0,0,0,0.55);
  }

  .sparkle{
    position:absolute;
    width:0.35em; height:0.35em;
    background:var(--gold-soft);
    clip-path:polygon(50% 0%, 63% 38%, 100% 50%, 63% 62%, 50% 100%, 37% 62%, 0% 50%, 37% 38%);
    animation:twinkle 2.6s ease-in-out infinite;
    filter:drop-shadow(0 0 4px rgba(240,198,105,0.8));
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.15; transform:scale(0.6) rotate(0deg); }
    50%{ opacity:1; transform:scale(1.15) rotate(35deg); }
  }

  /* ---------- HEADLINE ---------- */
  .headline-block{
    position:relative; z-index:3;
    text-align:center;
    margin-top:0.3em;
    animation:enter .8s .1s cubic-bezier(.2,.8,.2,1) both;
  }
  .headline{
    position:relative;
    font-family:var(--font-display);
    font-weight:900;
    font-size:1.95em;
    line-height:1.15;
    letter-spacing:-0.01em;
    margin:0;
    text-wrap:balance;
  }
  .headline-line{ display:block; }
  .letter{
    display:inline-block;
    color:var(--gold);
    text-shadow:0 2px 0 rgba(0,0,0,0.35);
    animation:letterChase 4s linear infinite;
  }
  .letter.is-space{ width:0.32em; }
  @keyframes letterChase{
    0%{
      color:#fff;
      text-shadow:0 0 0.25em #fff, 0 0 0.6em var(--gold-soft), 0 0 1em var(--gold), 0 2px 0 rgba(0,0,0,0.35);
      transform:translateY(-0.14em) scale(1.22) rotateZ(-2deg);
    }
    9%{
      color:#fff;
      text-shadow:0 0 0.18em rgba(255,255,255,0.9), 0 0 0.45em var(--gold-soft), 0 2px 0 rgba(0,0,0,0.35);
      transform:translateY(-0.06em) scale(1.08);
    }
    22%, 100%{
      color:var(--gold);
      text-shadow:0 2px 0 rgba(0,0,0,0.35);
      transform:translateY(0) scale(1) rotateZ(0deg);
    }
  }
  .subline{
    font-size:0.78em;
    color:var(--text-1);
    max-width:26em;
    margin:0.6em auto 0;
    line-height:1.5;
  }

  /* ---------- STATS ---------- */
  .stats-row{
    position:relative; z-index:3;
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:0.55em;
    margin-top:1em;
    animation:enter .8s .25s cubic-bezier(.2,.8,.2,1) both;
  }
  .stat-chip{
    background:var(--glass-fill);
    border:1px solid var(--glass-border);
    border-radius:1em;
    padding:0.55em 0.4em;
    text-align:center;
    backdrop-filter:blur(10px);
    box-shadow:0 1px 0 rgba(255,255,255,0.12) inset, 0 10px 20px -12px rgba(0,0,0,0.6);
  }
  .stat-prefix{
    display:block;
    font-family:var(--font-body);
    font-weight:800;
    font-size:0.44em;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--gold);
  }
  .stat-num{
    font-family:var(--font-display);
    font-weight:700;
    font-size:1.15em;
    color:var(--text-0);
    font-variant-numeric:tabular-nums;
  }
  .stat-unit{
    font-family:var(--font-display);
    font-weight:700;
    font-size:1.15em;
    color:var(--gold);
  }
  .stat-label{
    display:block;
    margin-top:0.15em;
    font-size:0.54em;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-2);
    font-weight:800;
  }

  /* ---------- CTA ---------- */
  .cta{
    position:relative; z-index:3;
    margin-top:1em;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0.5em;
    text-decoration:none;
    font-family:var(--font-body);
    font-weight:800;
    font-size:0.88em;
    letter-spacing:0.02em;
    color:#2a0906;
    padding:0.9em 1.4em;
    border-radius:3em;
    background:linear-gradient(155deg, var(--red-bright), var(--red) 55%, var(--red-deep) 100%);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.5) inset,
      0 14px 28px -12px rgba(216,31,26,0.65);
    overflow:hidden;
    animation:enter .8s .35s cubic-bezier(.2,.8,.2,1) both, pulseGlow 3.2s ease-in-out infinite;
    outline-offset:3px;
  }
  .cta:focus-visible{ outline:2px solid var(--gold-soft); }
  .cta span{ position:relative; z-index:1; color:var(--paper); text-shadow:0 1px 1px rgba(0,0,0,0.25); }
  .cta svg{ position:relative; z-index:1; width:1.1em; height:1.1em; transition:transform .25s ease; }
  .cta:hover svg{ transform:translateX(0.2em); }
  .cta::after{
    content:"";
    position:absolute; top:-120%; left:-50%;
    width:45%; height:340%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.55), transparent);
    transform:rotate(20deg);
    animation:shine 3.2s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{ box-shadow:0 1px 0 rgba(255,255,255,0.5) inset, 0 14px 28px -12px rgba(216,31,26,0.65); }
    50%{ box-shadow:0 1px 0 rgba(255,255,255,0.5) inset, 0 16px 34px -8px rgba(216,31,26,0.9); }
  }

  @keyframes enter{
    from{ opacity:0; transform:translateY(0.8em) scale(0.97); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .credit{
    font-family:var(--font-body);
    font-size:0.75rem;
    color:var(--text-2);
    letter-spacing:0.03em;
  }
</style>
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="skinGrad" x1="20%" y1="0%" x2="90%" y2="100%">
        <stop offset="0%" stop-color="#f4cda3"/>
        <stop offset="55%" stop-color="#d9a273"/>
        <stop offset="100%" stop-color="#b97b4e"/>
      </linearGradient>
      <linearGradient id="hairGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4a3527"/>
        <stop offset="100%" stop-color="#241609"/>
      </linearGradient>
      <linearGradient id="hairGradWarm" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#7a4a28"/>
        <stop offset="100%" stop-color="#3d2814"/>
      </linearGradient>
      <linearGradient id="outfitCenterGrad" x1="10%" y1="0%" x2="95%" y2="100%">
        <stop offset="0%" stop-color="#f7dfa0"/>

      /* 1 Daumen, seitlich abgespreizt */
      var thumbX = mirror ? 54.5 : 5.5;
      var thumbRot = mirror ? 62 : -62;
      g.appendChild(svgEl("ellipse", {
        cx:String(thumbX), cy:"71.5", rx:"2.3", ry:"3.3",
        fill:"url(#skinGrad)",
        transform:"rotate(" + thumbRot + " " + thumbX + " 71.5)"
      }));
      return g;
    }

    var earL = svgEl("ellipse", { cx:"18.3", cy:"17", rx:"2.6", ry:"4.2", fill:"url(#skinGrad)" });
    var earR = svgEl("ellipse", { cx:"41.7", cy:"17", rx:"2.6", ry:"4.2", fill:"url(#skinGrad)" });
    var head = svgEl("circle", { cx:"30", cy:"16", r:"12", fill:"url(#skinGrad)" });
    var hair = svgEl("path", { d:HAIR_PATHS[style.hairStyle] || HAIR_PATHS.short, fill:style.hair });
    var hairGroup = svgEl("g", {});
    hairGroup.appendChild(hair);
    (HAIR_STRANDS[style.hairStyle] || []).forEach(function(strand){
      if (strand.kind === "fill") {
        hairGroup.appendChild(svgEl("path", { d:strand.d, fill:style.hair }));
      } else {
        var lineStyle = HAIR_STROKE_STYLE[strand.kind];
        hairGroup.appendChild(svgEl("path", {
          d:strand.d, fill:"none",
          stroke:lineStyle.stroke, "stroke-width":lineStyle.width,
          "stroke-linecap":"round"
        }));
      }
    });
    var eyeL = svgEl("ellipse", { cx:"25.5", cy:"15", rx:"1.3", ry:"1.6", fill:"rgba(50,32,20,0.75)" });
    var eyeR = svgEl("ellipse", { cx:"34.5", cy:"15", rx:"1.3", ry:"1.6", fill:"rgba(50,32,20,0.75)" });
    var nose = svgEl("path", { d:"M30,15.5 L29,20.3 Q30,21.6 31,20.3", stroke:"rgba(74,42,20,0.5)", "stroke-width":"0.9", fill:"none", "stroke-linecap":"round" });
    var mouth = svgEl("path", { d:"M25.5,23.5 Q30,26.4 34.5,23.5", stroke:"rgba(74,42,20,0.55)", "stroke-width":"1.1", fill:"none", "stroke-linecap":"round" });
    var neck = svgEl("rect", { x:"24", y:"25", width:"12", height:"8", rx:"2", fill:"url(#skinGrad)" });

    [legL, legR, shoeL, shoeR, torso].forEach(function(el){ svg.appendChild(el); });
    svg.appendChild(buildArm("l"));
    svg.appendChild(buildArm("r"));
    [neck, earL, earR, head, hairGroup, eyeL, eyeR, nose, mouth].forEach(function(el){ svg.appendChild(el); });

    return svg;
  }

  document.querySelectorAll(".figure[data-role]").forEach(function(figureEl){
    figureEl.insertBefore(buildHumanFigure(figureEl.getAttribute("data-role")), figureEl.firstChild);
  });

  /* --- headline: Buchstabe-für-Buchstabe-Leuchtlauf (Loop) --- */
  (function(){
    var lines = document.querySelectorAll("#headline .headline-line");
    var letters = [];
    lines.forEach(function(lineEl){
      var text = lineEl.getAttribute("data-line") || "";
      text.split("").forEach(function(ch){
        var span = document.createElement("span");
        if (ch === " ") {
          span.className = "letter is-space";
          span.textContent = " ";
        } else {
          span.className = "letter";
          span.textContent = ch;
        }
        lineEl.appendChild(span);
        letters.push(span);
      });
    });
    var period = 4; /* s, muss zu @keyframes letterChase passen */
    var travel = period * 0.62; /* Anteil des Loops, in dem die Lichtwelle über den Text läuft */
    letters.forEach(function(span, i){
      var delay = -(i / Math.max(letters.length - 1, 1)) * travel;
      span.style.animationDelay = delay + "s";
      if (reduceMotion) { span.style.animation = "none"; span.style.color = "var(--gold)"; }
    });
  })();

  /* --- confetti --- */
  var layer = document.getElementById("confetti");
  var colors = ["#d81f1a","#f0c669","#faf5ea","#7a1512"];
  var count = reduceMotion ? 0 : 26;
  for (var i = 0; i < count; i++) {
    var el = document.createElement("span");
    el.className = "confetto";
    el.style.setProperty("--x", (Math.random() * 100) + "%");
    el.style.setProperty("--s", (0.25 + Math.random() * 0.25) + "em");
    el.style.setProperty("--c", colors[i % colors.length]);
    el.style.setProperty("--dur", (4 + Math.random() * 3.5) + "s");
    el.style.setProperty("--delay", (Math.random() * -6) + "s");
    layer.appendChild(el);
  }

  /* --- certificate loop (real-time rotating carousel) ---
     Platzhalter-Einträge – bitte durch echte Teilnehmer/Zertifikate ersetzen.
     Statt name/course/date/no kann pro Eintrag auch "image" gesetzt werden
     (Base64 oder Pfad zu einem eingescannten Original-Zertifikat); dann wird
     dieses Bild anstelle der generierten Urkunde angezeigt. */
  var CERTIFICATES = [
    { name:"Max Mustermann",   course:"Zertifizierter Systemadministrator", date:"12.03.2026", no:"MC-2026-0142" },
    { name:"Erika Musterfrau", course:"Cybersecurity",                      date:"28.02.2026", no:"MC-2026-0139" },
    { name:"Jonas Keller",     course:"DevOps Engineer",                    date:"15.02.2026", no:"MC-2026-0131" }
    // Beispiel für ein echtes, eingescanntes Zertifikat:
    // { image:"data:image/jpeg;base64,...", name:"Anna Beispiel" }
  ];

  function buildCertCard(cert){
    var card = document.createElement("div");
    card.className = "cert-card";

    var border = document.createElement("div");
    border.className = "cert-border";

    var seal = document.createElement("div");
    seal.className = "cert-seal";
    border.appendChild(seal);

    var kicker = document.createElement("div");
    kicker.className = "cert-kicker";
    kicker.textContent = "M&C AKADEMIE";
    border.appendChild(kicker);

    var title = document.createElement("div");
    title.className = "cert-title";
    title.textContent = "URKUNDE";
    border.appendChild(title);

    var sub = document.createElement("div");
    sub.className = "cert-sub";
    sub.textContent = "verliehen an";
    border.appendChild(sub);

    var name = document.createElement("div");
    name.className = "cert-name";
    name.textContent = cert.name || "";
    border.appendChild(name);

    var course = document.createElement("div");
    course.className = "cert-course";
    course.textContent = cert.course || "";
    border.appendChild(course);

    var meta = document.createElement("div");
    meta.className = "cert-meta";
    var dateSpan = document.createElement("span");
    dateSpan.textContent = cert.date || "";
    var dot = document.createElement("span");
    dot.textContent = "·";
    var noSpan = document.createElement("span");
    noSpan.textContent = cert.no ? ("Nr. " + cert.no) : "";
    meta.appendChild(dateSpan);
    meta.appendChild(dot);
    meta.appendChild(noSpan);
    border.appendChild(meta);

    var sigRow = document.createElement("div");
    sigRow.className = "cert-sig-row";
    ["Kursleitung", "Akademieleitung"].forEach(function(label){
      var sig = document.createElement("div");
      sig.className = "cert-sig";
      var line = document.createElement("span");
      line.className = "line";
      sig.appendChild(line);
      sig.appendChild(document.createTextNode(label));
      sigRow.appendChild(sig);
    });
    border.appendChild(sigRow);

    card.appendChild(border);
    return card;
  }

  var certLoop = document.getElementById("certLoop");
  var certSlides = [];
  CERTIFICATES.forEach(function(cert, i){
    var slide = document.createElement("div");
    slide.className = "cert-slide" + (i === 0 ? " is-active" : "");
    if (cert.image) {
      var img = document.createElement("img");
      img.className = "cert-photo";
      img.src = cert.image;
      img.alt = cert.name ? ("Zertifikat von " + cert.name) : "Zertifikat";
      slide.appendChild(img);
    } else {
      slide.appendChild(buildCertCard(cert));
    }
    certLoop.appendChild(slide);
    certSlides.push(slide);
  });

  if (certSlides.length > 1 && !reduceMotion) {
    var certIndex = 0;
    setInterval(function(){
      certSlides[certIndex].classList.remove("is-active");
      certIndex = (certIndex + 1) % certSlides.length;
      certSlides[certIndex].classList.add("is-active");
    }, 3400);
  }

  /* --- count-up stats --- */
  var nums = document.querySelectorAll(".stat-num");
  nums.forEach(function(node){
    var target = parseFloat(node.getAttribute("data-count"));
    var decimals = parseInt(node.getAttribute("data-decimals") || "0", 10);
    var suffix = node.getAttribute("data-suffix") || "";
    var grouped = node.hasAttribute("data-group");
    function fmt(n){
      return grouped
        ? n.toLocaleString("de-DE", { minimumFractionDigits:decimals, maximumFractionDigits:decimals })
        : n.toFixed(decimals);
    }
    if (node.hasAttribute("data-no-count")) {
      node.textContent = fmt(target) + suffix;
      return;
    }
    if (reduceMotion) {
      node.textContent = fmt(target) + suffix;
      return;
    }
    var start = null;
    var duration = 1600;
    function step(ts){
      if (!start) start = ts;
      var p = Math.min((ts - start) / duration, 1);
      var eased = 1 - Math.pow(1 - p, 3);
      node.textContent = fmt(target * eased) + suffix;
      if (p < 1) requestAnimationFrame(step);
    }
    setTimeout(function(){ requestAnimationFrame(step); }, 500);
  });

  /* --- pointer 3D tilt --- */
  var post = document.getElementById("post");
  if (!reduceMotion && window.matchMedia("(pointer: fine)").matches) {
    post.addEventListener("mousemove", function(e){
      var r = post.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width - 0.5;
      var py = (e.clientY - r.top) / r.height - 0.5;
      post.style.transform = "rotateY(" + (px * 10) + "deg) rotateX(" + (py * -10) + "deg)";
    });
    post.addEventListener("mouseleave", function(){
      post.style.transform = "rotateY(0deg) rotateX(0deg)";
    });
  }
})();
</script>
</body>
</html>
