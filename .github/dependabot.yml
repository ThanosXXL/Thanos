version: 2
updates:
  - package-ecosystem: npm
    directory: /my-route
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, my-route]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
