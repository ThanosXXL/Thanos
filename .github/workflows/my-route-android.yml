name: Build My Route Android (APK)

on:
  push:
    tags:
      - "my-route-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-route
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 21 einrichten (Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Web-Vollversion bauen
        run: npm run build:web

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          mkdir -p assets
          cp build/icon.png assets/icon-only.png
          cp build/icon.png assets/icon-foreground.png
          npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#050403' --iconBackgroundColorDark '#050403' || echo "Icon-Erzeugung übersprungen"
          npx cap sync android

      - name: APK bauen (debug-signiert, direkt installierbar)
        working-directory: my-route/android
        run: ./gradlew assembleDebug

      - name: APK benennen
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/My-Route-${VERSION}-android.apk"

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: my-route-android
          path: my-route/out/*.apk
          if-no-files-found: error

  release:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/my-route-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: my-route-android
          path: release-assets

      - name: APK an GitHub Release anhängen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --title "My Route ${{ github.ref_name }}" \
            --notes "Automatisch veröffentlichter Build von My Route." 2>/dev/null || true
          gh release upload "${{ github.ref_name }}" release-assets/* --clobber
