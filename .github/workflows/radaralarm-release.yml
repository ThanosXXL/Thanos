name: RadarAlarm Build & Release

on:
  push:
    tags:
      - "radaralarm-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag für den zu erstellenden Release (nur bei manuellem Start nötig, z.B. radaralarm-v0.1.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: radaralarm

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Desktop-App bauen
        run: npm run dist

      - name: Installer als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: radaralarm-${{ matrix.os }}
          path: |
            radaralarm/dist/*.exe
            radaralarm/dist/*.dmg
            radaralarm/dist/*.AppImage
          if-no-files-found: warn

  release:
    needs: build
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Artifacts herunterladen
        uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Release-Tag bestimmen
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "name=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=radaralarm-v0.1.0-manual.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Bei manuellem Start (workflow_dispatch) existiert der Tag noch nicht -
          # "gh release create" legt ihn dann automatisch auf dem aktuellen Commit an.
          gh release create "${{ steps.tag.outputs.name }}" \
            --target "${{ github.sha }}" \
            --title "RadarAlarm ${{ steps.tag.outputs.name }}" \
            --notes "RadarAlarm Demo – automatisch gebaute Installationspakete für Windows, macOS und Linux." \
            downloaded/*/*
