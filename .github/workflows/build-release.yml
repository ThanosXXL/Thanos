name: Build & Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Desktop-App bauen (und bei Tag-Push veröffentlichen)
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            npm run dist -- --publish always
          else
            npm run dist
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Installer als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: inventar-dashboard-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: warn

      - name: Downloader-App-Abhängigkeiten installieren
        run: npm install
        working-directory: downloader

      - name: Downloader-App bauen (und bei Tag-Push veröffentlichen)
        shell: bash
        working-directory: downloader
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            npm run dist -- --publish always
          else
            npm run dist
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Downloader-App-Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: inventar-dashboard-downloader-${{ matrix.os }}
          path: |
            downloader/dist/*.exe
            downloader/dist/*.dmg
            downloader/dist/*.AppImage
          if-no-files-found: warn
