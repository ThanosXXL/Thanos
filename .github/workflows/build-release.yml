name: Build & Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Als echten GitHub Release veröffentlichen (statt nur zu bauen)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Desktop-App bauen
        run: npm run dist -- --publish never

      - name: Installer als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: inventar-dashboard-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: warn

      - name: Downloader-App-Abhängigkeiten installieren
        run: npm install
        working-directory: downloader

      - name: Downloader-App bauen
        run: npm run dist -- --publish never
        working-directory: downloader

      - name: Downloader-App-Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: inventar-dashboard-downloader-${{ matrix.os }}
          path: |
            downloader/dist/*.exe
            downloader/dist/*.dmg
            downloader/dist/*.AppImage
          if-no-files-found: warn

  release:
    needs: build
    if: github.ref_type == 'tag' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Alle Build-Artifacts herunterladen
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Installer-Dateien für den Release sammeln
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" \) -exec cp {} release-assets/ \;
          echo "Gesammelte Release-Dateien:"
          ls -la release-assets

      - name: Tag bestimmen
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Alten Draft für dieses Tag entfernen (falls vorhanden)
        run: gh release delete "${{ steps.tag.outputs.tag }}" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release veröffentlichen
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" release-assets/* \
            --title "Inventar - Dashboard ${{ steps.tag.outputs.tag }}" \
            --notes "Automatisch gebaut von GitHub Actions." \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
