name: Build & Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Nach dem Bauen als GitHub Release veröffentlichen"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Desktop-App bauen
        run: npm run dist -- --publish never

      - name: Installer als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: dozenten-dashboard-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Tag bestimmen
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer-Artifacts herunterladen
        uses: actions/download-artifact@v4
        with:
          pattern: dozenten-dashboard-*
          path: release-assets
          merge-multiple: true

      - name: Installer ins Release hochladen (legt es an, falls es noch nicht existiert)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.tag.outputs.name }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.tag.outputs.name }}" release-assets/* --clobber
          else
            gh release create "${{ steps.tag.outputs.name }}" \
              --title "Dozenten Dashboard ${{ steps.tag.outputs.name }}" \
              --notes "Automatisch gebaut von GitHub Actions." \
              release-assets/*
          fi
