name: Build & Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Als GitHub Release veröffentlichen? (erstellt Tag v<version> aus package.json)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Desktop-App bauen
        run: npm run dist -- --publish=never

      - name: Installer als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: buchhaltung-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: warn

  release:
    needs: build
    if: github.ref_type == 'tag' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Alle Installer herunterladen
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Tag-Namen ermitteln
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Verwaisten Entwurf für diesen Tag entfernen (falls vorhanden)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.version.outputs.tag }}" --yes --repo ${{ github.repository }} --cleanup-tag || true

      - name: GitHub Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist-all/*/* \
            --repo ${{ github.repository }} \
            --title "Buchhaltung! ${{ steps.version.outputs.tag }}" \
            --notes "Automatisch veröffentlichter Desktop-Build (Windows/macOS/Linux)."
