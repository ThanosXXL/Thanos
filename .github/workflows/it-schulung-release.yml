name: Build & Release IT-Schulung Dashboard

on:
  push:
    tags:
      - "it-schulung-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: it-schulung

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Desktop-App bauen
        run: npm run dist

      - name: Installer als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: it-schulung-dashboard-${{ matrix.os }}
          path: |
            it-schulung/dist/*.exe
            it-schulung/dist/*.dmg
            it-schulung/dist/*.AppImage
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/it-schulung-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Tag bestimmen
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=it-schulung-v$(node -p "require('./it-schulung/package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer-Artifacts herunterladen
        uses: actions/download-artifact@v4
        with:
          pattern: it-schulung-dashboard-*
          path: release-assets
          merge-multiple: true

      - name: Installer ins Release hochladen (legt es an, falls es noch nicht existiert)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.tag.outputs.name }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.tag.outputs.name }}" release-assets/* --clobber
          else
            gh release create "${{ steps.tag.outputs.name }}" \
              --title "IT-Schulung Dashboard ${{ steps.tag.outputs.name }}" \
              --notes "Automatisch veröffentlichter Build des IT-Schulung Dashboards für Windows, macOS und Linux." \
              release-assets/*
          fi
