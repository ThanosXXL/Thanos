name: Build & Release Baustelle Tagesreport

on:
  push:
    tags:
      - "tagesreport-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Nach dem Bauen als GitHub Release veröffentlichen"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: baustelle-tagesreport

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Desktop-App bauen
        run: npm run dist

      - name: Installer als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: baustelle-tagesreport-${{ matrix.os }}
          path: |
            baustelle-tagesreport/dist/*.exe
            baustelle-tagesreport/dist/*.dmg
            baustelle-tagesreport/dist/*.AppImage
          if-no-files-found: warn

  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: baustelle-tagesreport

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Abhängigkeiten installieren
        run: npm install --ignore-scripts

      - name: Web-Assets in Android-Projekt synchronisieren
        run: npx cap sync android

      - name: Android-APK bauen (Debug, selbstsigniert)
        working-directory: baustelle-tagesreport/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk baustelle-tagesreport-android.apk

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: baustelle-tagesreport-android
          path: baustelle-tagesreport/baustelle-tagesreport-android.apk
          if-no-files-found: warn

  release:
    needs: [build-desktop, build-android]
    if: startsWith(github.ref, 'refs/tags/tagesreport-v') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Tag bestimmen
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=tagesreport-v$(node -p "require('./baustelle-tagesreport/package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Artifacts herunterladen
        uses: actions/download-artifact@v4
        with:
          pattern: baustelle-tagesreport-*
          path: release-assets
          merge-multiple: true

      - name: Release anlegen/aktualisieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.tag.outputs.name }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.tag.outputs.name }}" release-assets/* --clobber
          else
            gh release create "${{ steps.tag.outputs.name }}" \
              --title "Baustelle Tagesreport ${{ steps.tag.outputs.name }}" \
              --notes "Automatisch gebaut von GitHub Actions (Windows/macOS/Linux/Android)." \
              release-assets/*
          fi
