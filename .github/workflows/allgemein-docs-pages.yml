name: Allgemein Docs Web-App (Android / iOS / Browser)

on:
  push:
    tags:
      - "allgemein-docs-v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: allgemein-docs-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Web-App erzeugen
        run: node allgemein-docs/web/build-web.js

      - name: Installationsseite beilegen
        run: |
          mkdir -p allgemein-docs/web/dist/download
          cp allgemein-docs/install/index.html allgemein-docs/web/dist/download/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: allgemein-docs/web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
