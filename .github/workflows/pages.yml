name: PWA auf GitHub Pages veröffentlichen

# Veröffentlicht den Ordner renderer/ (die PWA-Variante von "IT Schulungsmaßnahmen")
# auf GitHub Pages, damit sie über eine echte HTTPS-URL installierbar ist
# (Android "Zum Startbildschirm hinzufügen", iOS Safari "Zum Home-Bildschirm").
#
# Läuft NUR manuell (workflow_dispatch), nicht automatisch bei jedem Push.
#
# Grund: GitHub Pages ist für dieses Repository noch nicht aktiviert (Settings → Pages →
# Source: "GitHub Actions"), und das Standard-GITHUB_TOKEN kann das nicht selbst per API
# einschalten ("Resource not accessible by integration"). Solange das nicht ein einziges
# Mal manuell nachgeholt wurde, würde ein automatischer "push"-Trigger bei jedem Commit
# einen roten CI-Check erzeugen, der aus dem Code heraus nicht behebbar ist.
#
# Sobald Pages aktiviert ist, kann dieser Workflow jederzeit manuell über
# Actions → "PWA auf GitHub Pages veröffentlichen" → "Run workflow" gestartet werden.
# Danach kann der Trigger unten bei Bedarf wieder auf "push" (z. B. auf main) umgestellt
# werden.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          # Versucht, GitHub Pages (Quelle: GitHub Actions) automatisch zu aktivieren,
          # falls es im Repository noch nicht eingeschaltet ist.
          enablement: true

      - name: renderer/ als Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: renderer

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
