name: Deploy mc-projectmanagement to GitHub Pages

on:
  push:
    branches:
      - claude/mc-projectmanagement-redesign-9cp57v
    paths:
      - "mc-projectmanagement/**"
      - ".github/workflows/deploy-mc-projectmanagement.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Website-Inhalt als Pages-Artifact hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: mc-projectmanagement

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
