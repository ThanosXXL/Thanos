name: Build & Release Office Plattform

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: office-platform

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Office Plattform bauen (und bei Tag-Push veröffentlichen)
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            npm run dist -- --publish always
          else
            npm run dist
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Installer als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: office-plattform-${{ matrix.os }}
          path: |
            office-platform/dist/*.exe
            office-platform/dist/*.dmg
            office-platform/dist/*.AppImage
          if-no-files-found: warn
