  :root {
    --paper: #ffffff;
    --navy-950: #100b0b;
    --navy-800: #1c1414;
    --navy-700: #281c1c;
    --navy-600: #362424;
    --ink-muted: #6b5a5a;
    --gold-900: #7a0000;
    --gold-700: #c40000;
    --gold-600: #e30000;
    --gold-500: #f20101;
    --gold-300: #ff6a55;
    --gold-100: #ffe0da;

    --stage-bg: #f2eeed;
    --stage-vignette: rgba(20, 8, 8, 0.08);
    --stage-text: #4a3a3a;
  }

  :root[data-theme="dark"] {
    --stage-bg: #0b0808;
    --stage-vignette: rgba(0, 0, 0, 0.55);
    --stage-text: #d9c4c1;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --stage-bg: #0b0808;
      --stage-vignette: rgba(0, 0, 0, 0.55);
      --stage-text: #d9c4c1;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 50% 20%, var(--stage-vignette), transparent 60%),
      var(--stage-bg);
    font-family: 'Flyer Sans', 'Segoe UI', system-ui, sans-serif;
    padding: 6vmin 4vmin;
    overflow-x: hidden;
  }

  .stage-label {
    position: fixed;
    top: 20px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--stage-text);
    opacity: 0.55;
    font-weight: 500;
    pointer-events: none;
  }

  /* ---------- Download link ----------
     Deliberately NOT position:fixed — some mobile document/file
     previewers (WhatsApp, Files-app "Quick Look", etc.) strip or
     mis-render fixed-position elements entirely. Keeping it in normal
     document flow, stacked above the card, guarantees it always
     renders regardless of viewer. */

  .page-stack {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    width: min(88vmin, 620px);
    gap: 12px;
  }

  .toolbar {
    display: flex;
    justify-content: flex-end;
  }

  .download-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--gold-600) 0%, var(--gold-500) 45%, var(--gold-900) 100%);
    color: var(--paper);
    font-family: 'Flyer Sans', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.01em;
    text-decoration: none;
    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.25);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.35) inset,
      0 -2px 5px rgba(50, 0, 0, 0.45) inset,
      0 8px 18px -8px rgba(8, 8, 8, 0.5);
    transition: transform 150ms ease, box-shadow 150ms ease;
  }

  .download-link:hover {
    transform: translateY(-1px);
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.8) inset,
      0 -2px 5px rgba(122, 0, 0, 0.45) inset,
      0 12px 22px -8px rgba(10, 6, 6, 0.6);
  }

  .download-link:focus-visible {
    outline: 2px solid var(--navy-800);
    outline-offset: 3px;
  }

  .download-link svg {
    width: 15px;
    height: 15px;
    flex: none;
  }

  @media (max-width: 520px) {
    .download-link span { display: none; }
    .download-link { padding: 10px; }
  }

  /* ---------- The Flyer Card ---------- */

  .flyer {
    position: relative;
    width: min(88vmin, 620px);
    aspect-ratio: 1 / 1;
    background: var(--paper);
    border-radius: 22px;
    overflow: hidden;
    isolation: isolate;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.9) inset,
      0 60px 90px -35px rgba(10, 6, 6, 0.45),
      0 20px 40px -20px rgba(10, 6, 6, 0.35);
    animation: card-in 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes card-in {
    from { opacity: 0; transform: scale(0.94) translateY(18px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* faint gold hairline frame, inset from edge */
  .flyer::before {
    content: "";
    position: absolute;
    inset: 18px;
    border: 1px solid rgba(227, 0, 0, 0.55);
    border-radius: 10px;
    pointer-events: none;
    z-index: 3;
  }

  /* ambient gloss sweep across the whole card */
  .flyer::after {
    content: "";
    position: absolute;
    inset: -50%;
    background: linear-gradient(
      115deg,
      transparent 40%,
      rgba(255, 255, 255, 0.55) 48%,
      rgba(255, 255, 255, 0.85) 50%,
      rgba(255, 255, 255, 0.55) 52%,
      transparent 60%
    );
    mix-blend-mode: soft-light;
    animation: card-sheen 7s ease-in-out infinite;
    animation-delay: 1.1s;
    z-index: 4;
    pointer-events: none;
  }

  @keyframes card-sheen {
    0%   { transform: translate3d(-30%, -10%, 0) rotate(0deg); opacity: 0; }
    8%   { opacity: 1; }
    30%  { transform: translate3d(30%, 10%, 0) rotate(0deg); opacity: 0; }
    100% { transform: translate3d(30%, 10%, 0) rotate(0deg); opacity: 0; }
  }

  /* corner brackets, plaque framing */
  .bracket {
    position: absolute;
    width: 30px;
    height: 30px;
    border: 2px solid var(--gold-600);
    z-index: 3;
    opacity: 0.9;
  }
  .bracket.tl { top: 30px; left: 30px; border-right: none; border-bottom: none; border-top-left-radius: 6px; }
  .bracket.br { bottom: 30px; right: 30px; border-left: none; border-top: none; border-bottom-right-radius: 6px; }

  .flyer-content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 2vmin, 18px);
    padding: 8% 10%;
    text-align: center;
  }

  /* ---------- Status chip ---------- */

  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 16px;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--navy-700), var(--navy-950));
    color: var(--gold-300);
    font-size: clamp(9px, 1.6vmin, 11px);
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.08) inset,
      0 6px 14px -6px rgba(10, 6, 6, 0.6);
    animation: fade-up 700ms cubic-bezier(0.16, 1, 0.3, 1) both;
    animation-delay: 180ms;
  }
  .status-chip .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold-300);
    box-shadow: 0 0 6px 1px rgba(255, 106, 85, 0.8);
    animation: pulse-dot 2.2s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.45; transform: scale(0.8); }
  }

  /* ---------- 3D logo plaque ---------- */

  .medallion-wrap {
    position: relative;
    flex: none;
    width: clamp(200px, 46vmin, 380px);
    height: clamp(72px, 16vmin, 142px);
    margin: clamp(4px, 1vmin, 10px) 0;
    animation: medallion-in 1000ms cubic-bezier(0.2, 0.9, 0.25, 1) both;
    animation-delay: 260ms;
  }

  @keyframes medallion-in {
    from { opacity: 0; transform: scale(0.85) rotateX(35deg); }
    to   { opacity: 1; transform: scale(1) rotateX(0deg); }
  }

  .medallion-float {
    width: 100%;
    height: 100%;
    animation: float 4.5s ease-in-out infinite;
    animation-delay: 1.2s;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }

  .medallion {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 22px;
    background: conic-gradient(from 200deg, var(--gold-300), var(--gold-700) 30%, var(--gold-900) 50%, var(--gold-600) 75%, var(--gold-300) 100%);
    box-shadow:
      0 14px 26px -10px rgba(122, 0, 0, 0.55),
      0 3px 8px -2px rgba(10, 6, 6, 0.35);
  }

  .medallion .face {
    position: absolute;
    inset: 6%;
    border-radius: 15px;
    background:
      radial-gradient(circle at 30% 20%, #ffffff, #faf6f5 55%, #f2e6e4 100%);
    box-shadow:
      0 2px 4px rgba(120, 20, 15, 0.28) inset,
      0 -1px 2px rgba(255, 255, 255, 0.7) inset;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 3% 5%;
  }

  .medallion .face::before {
    content: "";
    position: absolute;
    inset: -20%;
    background: linear-gradient(120deg, transparent 42%, rgba(255, 255, 255, 0.85) 50%, transparent 58%);
    animation: medallion-sheen 5s ease-in-out infinite;
    animation-delay: 1.6s;
  }

  @keyframes medallion-sheen {
    0%   { transform: translateX(-60%) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    35%  { transform: translateX(60%) rotate(0deg); opacity: 0; }
    100% { transform: translateX(60%) rotate(0deg); opacity: 0; }
  }

  .medallion .logo-img {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 2px 3px rgba(10, 6, 6, 0.25));
  }

  .medallion .ring {
    position: absolute;
    inset: 3%;
    border-radius: 18px;
    border: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow: 0 0 0 1px rgba(122, 0, 0, 0.4) inset;
  }

  /* ---------- Headline & copy ---------- */

  .headline {
    font-family: 'Flyer Display', Georgia, serif;
    font-weight: 700;
    font-size: clamp(22px, 4.6vmin, 40px);
    line-height: 1.22;
    color: var(--navy-950);
    text-wrap: balance;
    max-width: 22ch;
    animation: fade-up 700ms cubic-bezier(0.16, 1, 0.3, 1) both;
    animation-delay: 520ms;
  }

  .subhead {
    font-family: 'Flyer Sans', sans-serif;
    font-weight: 500;
    font-size: clamp(16px, 3vmin, 21px);
    line-height: 1.5;
    color: var(--ink-muted);
    max-width: 30ch;
    margin-top: -4px;
    animation: fade-up 700ms cubic-bezier(0.16, 1, 0.3, 1) both;
    animation-delay: 600ms;
  }

  /* ---------- Email button ---------- */

  .email-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: clamp(4px, 1.2vmin, 10px);
    padding: clamp(10px, 2vmin, 14px) clamp(18px, 3.4vmin, 26px);
    border-radius: 999px;
    background: linear-gradient(180deg, var(--gold-600) 0%, var(--gold-500) 45%, var(--gold-900) 100%);
    color: var(--paper);
    font-family: 'Flyer Sans', sans-serif;
    font-weight: 600;
    font-size: clamp(12px, 2.3vmin, 16px);
    letter-spacing: 0.01em;
    text-decoration: none;
    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.25);
    overflow: hidden;
    isolation: isolate;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.35) inset,
      0 -3px 6px rgba(50, 0, 0, 0.5) inset,
      0 10px 22px -8px rgba(50, 0, 0, 0.65);
    animation: fade-up 700ms cubic-bezier(0.16, 1, 0.3, 1) both;
    animation-delay: 700ms;
  }

  .email-btn::after {
    content: "";
    position: absolute;
    inset: -60%;
    background: linear-gradient(115deg, transparent 44%, rgba(255,255,255,0.8) 50%, transparent 56%);
    animation: btn-sheen 5s ease-in-out infinite;
    animation-delay: 2.4s;
    z-index: -1;
  }

  @keyframes btn-sheen {
    0%   { transform: translateX(-70%); opacity: 0; }
    10%  { opacity: 1; }
    32%  { transform: translateX(70%); opacity: 0; }
    100% { transform: translateX(70%); opacity: 0; }
  }

  .email-btn svg { width: 16px; height: 16px; flex: none; }

  /* ---------- Sign-off ---------- */

  .signoff {
    margin-top: clamp(2px, 1vmin, 8px);
    font-family: 'Flyer Display', Georgia, serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(14px, 2.7vmin, 21px);
    color: var(--gold-700);
    animation: fade-up 700ms cubic-bezier(0.16, 1, 0.3, 1) both;
    animation-delay: 820ms;
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .flyer, .status-chip, .status-chip .dot, .medallion-wrap, .medallion-float,
    .medallion .face::before, .headline, .subhead, .email-btn,
    .email-btn::after, .signoff, .flyer::after {
      animation: none !important;
    }
    .flyer::after { opacity: 0; }
  }
</style>
