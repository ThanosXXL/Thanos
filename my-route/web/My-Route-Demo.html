:root {
  --bg: #050403;
  --panel: #14110b;
  --panel-2: #0c0a06;
  --gold-hi: #fff2b3;
  --gold-1: #f7d56a;
  --gold-2: #e9b52c;
  --gold-3: #b9801a;
  --gold-4: #7a5410;
  --gold-5: #4a3207;
  --text: #f4ecd9;
  --muted: #b9a982;
  --line: rgba(233, 181, 44, 0.28);
  --radius: 18px;
  --accent: var(--gold-2);
  --on-accent: #2a1c03;
  --field: #0c0a06;
  --map-bg: #0c0905;
  --font: "Open Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body { margin: 0; min-height: 100%; max-width: 100%; }
.split > *, .grid > *, .hero > * { min-width: 0; }
.card-actions .btn, .row .btn { max-width: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  overflow-x: hidden;
}

/* Warmes Umgebungslicht – wie der Schein um den Globus im Logo */
.bg-glow {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(60% 45% at 50% 18%, rgba(233, 181, 44, 0.16), transparent 70%),
    radial-gradient(50% 40% at 85% 90%, rgba(185, 128, 26, 0.12), transparent 70%);
  animation: breathe 7s ease-in-out infinite;
}
@keyframes breathe { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }

/* ---------- 3D-Gold-Schrift (Hochglanz, extrudiert) ---------- */
.gold3d, .gold3d-sm {
  font-weight: 800;
  letter-spacing: .04em;
  background:
    linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .95) 50%, transparent 62%) 140% 0 / 250% 100% no-repeat,
    linear-gradient(180deg, var(--gold-hi) 0%, var(--gold-1) 38%, var(--gold-3) 52%, var(--gold-2) 70%, var(--gold-1) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  filter:
    drop-shadow(0 1px 0 var(--gold-4))
    drop-shadow(0 2px 0 #6a4609)
    drop-shadow(0 3px 0 var(--gold-5))
    drop-shadow(0 8px 14px rgba(233, 181, 44, .35));
  animation: shine 6s ease-in-out infinite;
}
.gold3d-sm {
  filter:
    drop-shadow(0 1px 0 var(--gold-4))
    drop-shadow(0 2px 0 var(--gold-5))
    drop-shadow(0 5px 8px rgba(233, 181, 44, .3));
}
@keyframes shine { 0%, 55% { background-position: 140% 0, 0 0; } 100% { background-position: -80% 0, 0 0; } }

/* ---------- Kopfzeile ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
  background: linear-gradient(180deg, rgba(20, 16, 8, .96), rgba(5, 4, 3, .9));
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 8px 30px rgba(0, 0, 0, .6);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-logo {
  width: 52px; height: 52px; border-radius: 14px; display: block;
  box-shadow: 0 0 0 1px var(--line), 0 6px 18px rgba(233, 181, 44, .35);
  animation: float 5s ease-in-out infinite;
}
.brand-title { font-size: 26px; line-height: 1; }
.brand-sub { font-size: 10px; letter-spacing: .32em; color: var(--muted); margin-top: 4px; }
.tabs { display: flex; gap: 6px; margin-left: auto; overflow-x: auto; max-width: 100%; padding: 4px 2px; }
.tab {
  font: inherit; font-weight: 700; font-size: 14px; color: var(--muted);
  background: transparent; border: 1px solid transparent; border-radius: 12px;
  padding: 8px 16px; cursor: pointer; transition: all .2s ease; white-space: nowrap;
}
.tab:hover { color: var(--gold-1); transform: translateY(-1px); }
.tab.active {
  color: #2a1c03;
  background: linear-gradient(180deg, var(--gold-hi), var(--gold-1) 45%, var(--gold-2));
  box-shadow: 0 3px 0 var(--gold-4), 0 8px 16px rgba(233, 181, 44, .3), inset 0 1px 0 rgba(255, 255, 255, .8);
}
.topbar-actions { display: flex; gap: 8px; }

@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

/* ---------- Inhalt ---------- */
.content {
  position: relative; z-index: 1;
  max-width: 1180px; margin: 0 auto;
  padding: 28px max(16px, env(safe-area-inset-right)) 80px max(16px, env(safe-area-inset-left));
}
.view { animation: fadeUp .5s ease backwards; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.section-title { font-size: 30px; margin: 28px 0 4px; display: inline-block; }
.section-sub { color: var(--muted); margin: 0 0 20px; }

/* ---------- Hero ---------- */
.hero { display: grid; grid-template-columns: minmax(240px, 420px) 1fr; gap: 36px; align-items: center; margin-top: 8px; }
.hero-logo-wrap { perspective: 900px; }
.hero-logo {
  width: 100%; height: auto; display: block; border-radius: 28px;
  box-shadow: 0 0 0 1px var(--line), 0 30px 60px rgba(0, 0, 0, .7), 0 0 80px rgba(233, 181, 44, .22);
  animation: float 6s ease-in-out infinite, glowPulse 5s ease-in-out infinite;
}
@keyframes glowPulse {
  0%, 100% { box-shadow: 0 0 0 1px var(--line), 0 30px 60px rgba(0, 0, 0, .7), 0 0 50px rgba(233, 181, 44, .15); }
  50% { box-shadow: 0 0 0 1px var(--line), 0 30px 60px rgba(0, 0, 0, .7), 0 0 110px rgba(233, 181, 44, .38); }
}
.greeting { color: var(--gold-1); font-weight: 700; margin: 0 0 6px; }
.hero-title { font-size: clamp(44px, 8vw, 84px); line-height: 1; margin: 0; }
.hero-sub { letter-spacing: .5em; color: #efe3c8; font-weight: 700; margin: 12px 0 18px; font-size: 15px; }
.hero-text { color: var(--muted); font-size: 18px; max-width: 520px; margin: 0 0 22px; }
.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 34px 0 6px; }
.stat { text-align: center; padding: 16px 10px; }
.stat-num { font-size: 36px; font-weight: 800; color: var(--gold-1); text-shadow: 0 2px 0 var(--gold-4), 0 6px 16px rgba(233, 181, 44, .4); }
.stat-label { color: var(--muted); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }

/* ---------- Karten (3D-Glas) ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.card {
  position: relative; border-radius: var(--radius); padding: 18px;
  background: linear-gradient(160deg, rgba(38, 30, 14, .92), rgba(14, 11, 6, .96));
  border: 1px solid var(--line);
  box-shadow: 0 14px 34px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 240, 180, .18), inset 0 -18px 30px rgba(0, 0, 0, .35);
  transform-style: preserve-3d;
  transition: transform .18s ease-out, box-shadow .25s ease, border-color .25s ease;
  animation: fadeUp .5s ease backwards;
  overflow: hidden;
}
.card::before { /* Hochglanz-Reflex */
  content: ""; position: absolute; inset: 0 0 55% 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 240, 190, .10), transparent);
  border-radius: var(--radius) var(--radius) 60% 60% / var(--radius) var(--radius) 20% 20%;
}
.card:hover { border-color: rgba(247, 213, 106, .55); box-shadow: 0 20px 44px rgba(0, 0, 0, .65), 0 0 30px rgba(233, 181, 44, .18), inset 0 1px 0 rgba(255, 240, 180, .3); }
.card h3 { margin: 0 0 8px; font-size: 18px; color: var(--gold-1); }
.tilt { transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .12s ease-out; }
.tilt-soft { transform: perspective(1200px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); }

.card-head { display: flex; gap: 12px; align-items: flex-start; }
.card-icon {
  flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 24px;
  background: radial-gradient(circle at 30% 25%, var(--gold-hi), var(--gold-2) 55%, var(--gold-3));
  box-shadow: 0 4px 0 var(--gold-4), 0 10px 18px rgba(233, 181, 44, .3), inset 0 2px 3px rgba(255, 255, 255, .7);
}
.card-title { font-weight: 700; font-size: 18px; color: var(--text); word-break: break-word; }
.card-meta { color: var(--muted); font-size: 13px; margin-top: 2px; word-break: break-word; }
.chain { color: var(--muted); font-size: 14px; margin: 12px 0; }
.chain b { color: var(--gold-1); font-weight: 700; }
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.badge { display: inline-block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--gold-1); margin-right: 6px; }

.empty { grid-column: 1 / -1; text-align: center; padding: 34px 20px; }
.empty p { color: var(--muted); max-width: 520px; margin: 0 auto 16px; }

/* ---------- Buttons (3D, glänzend) ---------- */
.btn {
  position: relative; overflow: hidden; font: inherit; font-weight: 800; font-size: 15px; color: #2a1c03;
  border: 0; border-radius: 14px; padding: 12px 22px; cursor: pointer;
  background: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold-1) 40%, var(--gold-2) 62%, var(--gold-3) 100%);
  box-shadow: 0 5px 0 var(--gold-4), 0 12px 22px rgba(233, 181, 44, .28), inset 0 1px 0 rgba(255, 255, 255, .85), inset 0 -8px 12px rgba(122, 84, 16, .35);
  text-shadow: 0 1px 0 rgba(255, 240, 180, .7);
  transition: transform .12s ease, box-shadow .12s ease, filter .2s ease;
}
.btn::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 48%; background: linear-gradient(180deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, .05)); border-radius: 14px 14px 50% 50% / 14px 14px 12px 12px; pointer-events: none; }
.btn::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(105deg, transparent, rgba(255, 255, 255, .7), transparent); transform: skewX(-18deg); pointer-events: none; }
.btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.06); }
.btn:hover:not(:disabled)::after { animation: sweep .7s ease; }
@keyframes sweep { to { left: 130%; } }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--gold-4), 0 5px 10px rgba(233, 181, 44, .25), inset 0 1px 0 rgba(255, 255, 255, .7); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.small { font-size: 13px; padding: 8px 14px; border-radius: 11px; box-shadow: 0 4px 0 var(--gold-4), 0 8px 14px rgba(233, 181, 44, .22), inset 0 1px 0 rgba(255, 255, 255, .85), inset 0 -6px 10px rgba(122, 84, 16, .3); }
.btn.ghost {
  color: var(--gold-1); text-shadow: none;
  background: linear-gradient(180deg, rgba(60, 46, 18, .9), rgba(22, 17, 8, .95));
  box-shadow: 0 4px 0 #2a1d06, 0 10px 18px rgba(0, 0, 0, .5), inset 0 0 0 1px var(--line), inset 0 1px 0 rgba(255, 240, 180, .25);
}
.btn.ghost::before { background: linear-gradient(180deg, rgba(255, 240, 190, .16), transparent); }
.btn.danger { color: #ffb7a8; }
.btn.go { font-size: 17px; padding: 14px 26px; }

/* ---------- Formulare ---------- */
.split { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 22px; align-items: start; }
.form { display: flex; flex-direction: column; gap: 12px; }
.form label { display: flex; flex-direction: column; gap: 5px; font-weight: 700; font-size: 14px; color: var(--gold-1); }
.form label.check { flex-direction: row; align-items: center; gap: 10px; color: var(--text); font-weight: 600; }
.hint { color: var(--muted); font-weight: 400; font-size: 12.5px; margin: 0; }
input[type="text"], select {
  font: inherit; color: var(--text); width: 100%;
  background: linear-gradient(180deg, #080604, #120e07); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
  box-shadow: inset 0 3px 8px rgba(0, 0, 0, .7), 0 1px 0 rgba(255, 240, 180, .08);
}
input[type="text"]:focus, select:focus { outline: none; border-color: var(--gold-1); box-shadow: inset 0 3px 8px rgba(0, 0, 0, .7), 0 0 0 3px rgba(233, 181, 44, .25); }
input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--gold-2); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row.nowrap { flex-wrap: nowrap; }
.row.nowrap select { min-width: 0; }
.row.nowrap .btn { flex: none; }
.row.center { justify-content: center; }
.grow { flex: 1; min-width: 0; }
.mt10 { margin-top: 10px; }

.stops { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; counter-reset: stop; }
.stop {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px;
  background: rgba(0, 0, 0, .35); border: 1px solid var(--line); animation: fadeUp .3s ease backwards;
}
.stop-num { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #2a1c03; background: radial-gradient(circle at 30% 25%, var(--gold-hi), var(--gold-2) 60%, var(--gold-3)); box-shadow: 0 2px 0 var(--gold-4), inset 0 1px 2px rgba(255, 255, 255, .8); }
.stop-name { flex: 1; font-weight: 600; word-break: break-word; }
.mini { font: inherit; width: 30px; height: 30px; border-radius: 9px; cursor: pointer; color: var(--gold-1); background: rgba(233, 181, 44, .1); border: 1px solid var(--line); }
.mini:hover { background: rgba(233, 181, 44, .25); }
.mini:disabled { opacity: .3; cursor: default; }

/* ---------- Karte ---------- */
.map-card { padding: 18px; }
.map-pick { display: flex; flex-direction: column; gap: 5px; font-weight: 700; color: var(--gold-1); max-width: 360px; margin-bottom: 14px; }
#map-box svg { width: 100%; height: auto; display: block; border-radius: 14px; background: radial-gradient(80% 80% at 50% 40%, #1a140a, #070504); box-shadow: inset 0 0 0 1px var(--line), inset 0 10px 30px rgba(0, 0, 0, .7); }
.map-label { fill: #f4ecd9; stroke: #050403; }
.look-select { width: auto; font-size: 13px; padding: 8px 10px; cursor: pointer; }
.route-line { stroke-dasharray: 10 8; animation: dash 1.4s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -36; } }
.pin { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) both; transform-box: fill-box; transform-origin: center; }
@keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ---------- Info ---------- */
.info p, .info li { color: #e5dac0; }
.info h3 { margin-top: 22px; }
.howto { padding-left: 22px; }
.howto li { margin-bottom: 8px; }
.howto strong { color: var(--gold-1); }
.signature { text-align: center; letter-spacing: .4em; color: var(--muted) !important; margin-top: 28px; font-size: 12px; }

/* ---------- Hinweis (Toast) ---------- */
.toast {
  position: fixed; left: 50%; bottom: 26px; z-index: 50; transform: translate(-50%, 30px); opacity: 0; pointer-events: none;
  padding: 12px 22px; border-radius: 14px; font-weight: 700; color: #2a1c03; max-width: 90vw; text-align: center;
  background: linear-gradient(180deg, var(--gold-hi), var(--gold-2));
  box-shadow: 0 5px 0 var(--gold-4), 0 16px 30px rgba(0, 0, 0, .6);
  transition: all .35s cubic-bezier(.2, 1.4, .4, 1);
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }

/* ---------- Mobil ---------- */
@media (max-width: 860px) {
  .hero { grid-template-columns: 1fr; text-align: center; }
  .hero-logo-wrap { max-width: 320px; margin: 0 auto; }
  .hero-text { margin-left: auto; margin-right: auto; }
  .hero-actions { justify-content: center; }
  .split { grid-template-columns: 1fr; }
  .tabs { margin-left: 0; order: 3; width: 100%; }
  .topbar-actions { margin-left: 0; flex-wrap: wrap; width: 100%; }
  .topbar-actions .look-select { flex: 1 1 140px; min-width: 0; }
}
@media (max-width: 860px) {
  .tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .btn.go { font-size: 16px; padding: 13px 20px; }
  .tab { padding: 10px 14px; }
}
@media (max-width: 480px) {
  .stats { gap: 8px; }
  .stat { padding: 12px 4px; }
  .stat-num { font-size: 28px; }
  .stat-label { font-size: 11px; letter-spacing: .06em; }
  .brand-title { font-size: 22px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Alternative Optiken: flach & ruhig (ohne 3D) ---------- */
:root[data-look="klar"], :root[data-look="hell"] {
  --radius: 14px;
  --on-accent: #1d1503;
}
:root[data-look="klar"] {
  --bg: #0f1115; --panel: #181b22; --text: #eceef2; --muted: #98a0ae; --line: rgba(255, 255, 255, .13);
  --accent: #e9b52c; --field: #0c0e12; --map-bg: #0c0e12; --gold-1: #f0c75a;
}
:root[data-look="hell"] {
  --bg: #f5f1e8; --panel: #ffffff; --text: #231d12; --muted: #6b6149; --line: rgba(60, 45, 10, .16);
  --accent: #c8932a; --on-accent: #ffffff; --field: #faf7f0; --map-bg: #fbf8f1; --gold-1: #8f610a;
}
[data-look="klar"] .bg-glow, [data-look="hell"] .bg-glow { animation: none; opacity: .0; }
[data-look="klar"] .bg-glow { opacity: .35; }
[data-look="klar"] .gold3d, [data-look="klar"] .gold3d-sm, [data-look="hell"] .gold3d, [data-look="hell"] .gold3d-sm {
  background: none; color: var(--gold-1); -webkit-text-fill-color: var(--gold-1); filter: none; animation: none; letter-spacing: .03em;
}
[data-look="klar"] .topbar, [data-look="hell"] .topbar { background: var(--panel); backdrop-filter: none; box-shadow: 0 1px 0 var(--line); }
[data-look="klar"] .brand-logo, [data-look="klar"] .hero-logo, [data-look="hell"] .brand-logo, [data-look="hell"] .hero-logo { animation: none; box-shadow: 0 0 0 1px var(--line), 0 8px 24px rgba(0, 0, 0, .18); }
[data-look="klar"] .card, [data-look="hell"] .card { background: var(--panel); box-shadow: 0 1px 2px rgba(0, 0, 0, .15), 0 8px 24px rgba(0, 0, 0, .1); transform: none !important; }
[data-look="klar"] .card:hover, [data-look="hell"] .card:hover { border-color: var(--accent); box-shadow: 0 1px 2px rgba(0, 0, 0, .15), 0 10px 28px rgba(0, 0, 0, .16); }
[data-look="klar"] .card::before, [data-look="hell"] .card::before, [data-look="klar"] .btn::before, [data-look="hell"] .btn::before, [data-look="klar"] .btn::after, [data-look="hell"] .btn::after { display: none; }
[data-look="klar"] .btn, [data-look="hell"] .btn { background: var(--accent); color: var(--on-accent); box-shadow: none; text-shadow: none; border-radius: 10px; }
[data-look="klar"] .btn:hover:not(:disabled), [data-look="hell"] .btn:hover:not(:disabled) { filter: brightness(1.08); transform: none; }
[data-look="klar"] .btn:active:not(:disabled), [data-look="hell"] .btn:active:not(:disabled) { transform: scale(.98); box-shadow: none; }
[data-look="klar"] .btn.ghost, [data-look="hell"] .btn.ghost { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
[data-look="klar"] .btn.danger, [data-look="hell"] .btn.danger { color: #d9493a; }
[data-look="klar"] .tab.active, [data-look="hell"] .tab.active { background: var(--accent); color: var(--on-accent); box-shadow: none; }
[data-look="klar"] input[type="text"], [data-look="klar"] select, [data-look="hell"] input[type="text"], [data-look="hell"] select { background: var(--field); color: var(--text); box-shadow: none; }
[data-look="klar"] .card-icon, [data-look="hell"] .card-icon, [data-look="klar"] .stop-num, [data-look="hell"] .stop-num { background: var(--accent); box-shadow: none; color: var(--on-accent); }
[data-look="klar"] .stat-num, [data-look="hell"] .stat-num { text-shadow: none; color: var(--gold-1); }
[data-look="klar"] .stop, [data-look="hell"] .stop { background: var(--field); }
[data-look="klar"] .hero-sub, [data-look="hell"] .hero-sub, [data-look="klar"] .info p, [data-look="hell"] .info p, [data-look="klar"] .info li, [data-look="hell"] .info li { color: var(--text); }
[data-look="klar"] .signature, [data-look="hell"] .signature { color: var(--muted) !important; }
[data-look="klar"] .toast, [data-look="hell"] .toast { background: var(--accent); color: var(--on-accent); box-shadow: 0 8px 24px rgba(0, 0, 0, .3); }
[data-look="klar"] #map-box svg, [data-look="hell"] #map-box svg { background: var(--map-bg); box-shadow: inset 0 0 0 1px var(--line); }
[data-look="klar"] .map-label { fill: var(--text); stroke: var(--bg); }
[data-look="hell"] .map-label { fill: var(--text); stroke: var(--bg); }
[data-look="hell"] .mini { background: rgba(200, 147, 42, .12); }

/* ---------- Fahrmodus & Touch-Bedienung (Auto, Tablet, Handy) ---------- */
.drive-h { color: var(--gold-1); margin: 26px 0 12px; font-size: 20px; }
.drive-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.drive-tile { display: flex; flex-direction: column; gap: 12px; }
.drive-tile .card-title { font-size: 24px; }
.btn.mega { font-size: 26px; padding: 22px 28px; width: 100%; border-radius: 18px; }
.btn.mega-sub { width: 100%; font-size: 18px; padding: 16px 20px; }
.drive-fav { display: flex; align-items: center; gap: 14px; text-align: left; font: inherit; color: var(--text); cursor: pointer; padding: 18px; width: 100%; }
.drive-fav .card-title { display: block; font-size: 20px; }
.drive-fav .card-meta { display: block; }
.drive-fav .card-icon { width: 56px; height: 56px; font-size: 30px; }

dialog.live { width: min(720px, 94vw); max-height: 92vh; overflow: auto; border-radius: 22px; border: 1px solid var(--line); color: var(--text); padding: 20px;
  background: linear-gradient(160deg, #2a210f, #0e0b06); box-shadow: 0 30px 80px rgba(0, 0, 0, .8), inset 0 1px 0 rgba(255, 240, 180, .2); }
dialog.live::backdrop { background: rgba(0, 0, 0, .65); backdrop-filter: blur(3px); }
.live-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.live-head h3 { margin: 0; font-size: 22px; }
.live-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.live-form label { display: flex; flex-direction: column; gap: 5px; font-weight: 700; font-size: 14px; color: var(--gold-1); }
.live-status { margin: 12px 0; font-weight: 700; color: var(--gold-1); min-height: 1.4em; }
.live-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.live-opt { display: flex; flex-direction: column; gap: 8px; animation: fadeUp .4s ease backwards; }
.live-big { font-size: 22px; }
.live-big b { color: var(--gold-1); font-size: 30px; }
:root[data-look="klar"] dialog.live, :root[data-look="hell"] dialog.live { background: var(--panel); box-shadow: 0 20px 60px rgba(0, 0, 0, .35); }

:root[data-touch="on"] body { font-size: 17px; }
:root[data-touch="on"] .btn { min-height: 54px; font-size: 17px; padding: 14px 24px; }
:root[data-touch="on"] .btn.small { min-height: 48px; font-size: 15px; padding: 10px 16px; }
:root[data-touch="on"] .tab { min-height: 50px; font-size: 16px; padding: 12px 18px; }
:root[data-touch="on"] input[type="text"], :root[data-touch="on"] select { min-height: 54px; font-size: 17px; }
:root[data-touch="on"] .mini { width: 46px; height: 46px; font-size: 18px; }
:root[data-touch="on"] input[type="checkbox"] { width: 28px; height: 28px; }
:root[data-touch="on"] .card { transform: none !important; }
:root[data-touch="on"] .card-actions { gap: 12px; }
:root[data-touch="on"] .look-select { min-height: 48px; }
@media (max-width: 600px) { .live-form { grid-template-columns: 1fr; } .btn.mega { font-size: 24px; } }

.demo-wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:32px 16px 70px;text-align:center}
.demo-wrap .brand-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:6px}
.demo-wrap .brand-row img{width:84px;height:84px;border-radius:20px;box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(233,181,44,.3)}
.demo-wrap h1{margin:0;font-size:clamp(34px,6vw,60px)}
.optik{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0 18px}
.optik .btn{min-width:150px}
.optik .btn.active{outline:3px solid var(--gold-hi);outline-offset:3px}
.player{border-radius:20px;overflow:hidden;background:#000;box-shadow:0 0 0 1px var(--line),0 30px 70px rgba(0,0,0,.7),0 0 70px rgba(233,181,44,.2)}
.player video{width:100%;display:block;aspect-ratio:16/9;background:#000}
.dl-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.dl-note{color:var(--muted);margin:14px 0 0;font-size:14px}
a.btn{text-decoration:none;display:inline-block}
</style></head>
