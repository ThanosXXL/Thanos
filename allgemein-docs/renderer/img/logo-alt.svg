<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5cc8ff"/>
      <stop offset="0.45" stop-color="#1e73e8"/>
      <stop offset="1" stop-color="#0a2a7a"/>
    </linearGradient>
    <radialGradient id="glowBg" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#9be2ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9be2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9defa"/>
    </linearGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7e86"/>
      <stop offset="0.5" stop-color="#e3213a"/>
      <stop offset="1" stop-color="#8f0c22"/>
    </linearGradient>
    <linearGradient id="crossSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f0c22"/>
      <stop offset="1" stop-color="#4d0412"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
