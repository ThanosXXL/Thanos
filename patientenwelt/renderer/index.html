<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>PatientenWelt</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">&#9877;</span>
      <span class="brand-title text-glossy-dark">PatientenWelt</span>
    </div>
    <div class="header-search">
      <input type="text" id="patientSearch" placeholder="Patient suchen (Name)&#8230;">
    </div>
    <button id="newPatientBtn" class="btn-glossy btn-primary">+ Neuer Patient</button>
  </header>

  <div class="icon-toolbar" id="iconToolbar">
    <button type="button" id="toolPatientListBtn" class="tool-icon-btn" title="Patient wählen" aria-label="Patient wählen">&#128100;</button>
    <button type="button" id="toolNewPatientBtn" class="tool-icon-btn" title="Neuer Patient" aria-label="Neuer Patient">&#10133;</button>
    <button type="button" id="toolSearchBtn" class="tool-icon-btn" title="Suche" aria-label="Suche">&#128269;</button>
    <span class="tool-sep" aria-hidden="true"></span>
    <button type="button" id="toolTermineBtn" class="tool-icon-btn" title="Termine des Patienten" aria-label="Termine">&#128197;</button>
    <button type="button" id="toolBriefeBtn" class="tool-icon-btn" title="Briefe des Patienten" aria-label="Briefe">&#9993;</button>
    <button type="button" id="toolLaborBtn" class="tool-icon-btn" title="Laborwerte des Patienten" aria-label="Laborwerte">&#129514;</button>
    <span class="tool-sep" aria-hidden="true"></span>
    <button type="button" id="toolPrintBtn" class="tool-icon-btn" title="Drucken" aria-label="Drucken">&#128438;</button>
    <button type="button" id="toolReloadBtn" class="tool-icon-btn" title="Neu laden" aria-label="Neu laden">&#8635;</button>
    <button type="button" id="toolSettingsBtn" class="tool-icon-btn" title="Einstellungen (Demo – noch nicht verfügbar)" aria-label="Einstellungen" disabled>&#9881;</button>
  </div>

  <div class="app-body">
    <nav class="sidebar" id="sidebar">
      <!-- Sidebar-Navigation wird hier eingefügt -->
    </nav>

    <main id="content">
      <!-- Hauptinhalt wird hier eingefügt -->
    </main>
  </div>

  <!-- Modal: Patient anlegen / bearbeiten -->
  <div class="modal-overlay" id="patientFormModal">
    <div class="modal">
      <h2 id="patientFormTitle">Neuen Patienten anlegen</h2>
      <div class="form-grid">
        <label>Nachname
          <input type="text" id="fieldNachname" maxlength="60">
        </label>
        <label>Vorname
          <input type="text" id="fieldVorname" maxlength="60">
        </label>
        <label>Geburtsdatum
          <input type="date" id="fieldGeburtsdatum">
        </label>
        <label>Geschlecht
          <select id="fieldGeschlecht">
            <option value="w">weiblich</option>
            <option value="m">männlich</option>
            <option value="d">divers</option>
          </select>
        </label>
        <label>Krankenkasse
          <input type="text" id="fieldVersicherung" maxlength="80" placeholder="z. B. AOK Niedersachsen">
        </label>
        <label>Versichertennummer
          <input type="text" id="fieldVersichertenNr" maxlength="40">
        </label>
      </div>
      <div class="modal-actions">
        <button id="cancelPatientForm" class="btn-glossy btn-secondary">Abbrechen</button>
        <button id="confirmPatientForm" class="btn-glossy btn-primary">Speichern</button>
      </div>
    </div>
  </div>

  <!-- Modal: Patient löschen bestätigen -->
  <div class="modal-overlay" id="deletePatientModal">
    <div class="modal">
      <h2>Patient entfernen?</h2>
      <p id="deletePatientText"></p>
      <div class="modal-actions">
        <button id="cancelDeletePatient" class="btn-glossy btn-secondary">Abbrechen</button>
        <button id="confirmDeletePatient" class="btn-glossy btn-danger">Entfernen</button>
      </div>
    </div>
  </div>

  <!-- Modal: Eintrag hinzufügen (Journal/Rezepte/Termine/Briefe/Labor) -->
  <div class="modal-overlay" id="entryFormModal">
    <div class="modal">
      <h2 id="entryFormTitle">Eintrag hinzufügen</h2>
      <div class="form-grid" id="entryFormFields">
        <!-- Felder werden je nach Kategorie eingefügt -->
      </div>
      <div class="modal-actions">
        <button id="cancelEntryForm" class="btn-glossy btn-secondary">Abbrechen</button>
        <button id="confirmEntryForm" class="btn-glossy btn-primary">Hinzufügen</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
