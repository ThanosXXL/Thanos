<!doctype html>
<title>PatientenWelt Flyer – Post-Format</title>
<style>
  :root {
    --blue-900: #062a5e; --blue-800: #0a3d91; --blue-700: #0f56b8; --blue-600: #1565c0;
    --blue-500: #2f86e0; --blue-400: #5aa3ec; --blue-300: #8fc2f4; --blue-100: #dcedff;
    --blue-50: #eef5ff; --white: #ffffff; --ink: #10233d; --ink-soft: #45587a;
    --page-bg: var(--blue-50); --card-bg: var(--white); --border: var(--blue-100);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #061c3a; --card-bg: #0a2a52; --border: #123a6c;
      --ink: #eaf2ff; --ink-soft: #b7cdec; --blue-50: #0d3260; --blue-100: #123a6c;
    }
  }
  :root[data-theme="dark"] {
    --page-bg: #061c3a; --card-bg: #0a2a52; --border: #123a6c;
    --ink: #eaf2ff; --ink-soft: #b7cdec; --blue-50: #0d3260; --blue-100: #123a6c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--page-bg); color: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px 56px; gap: 20px;
  }
  h1 { margin: 0; font-size: 24px; font-weight: 800; text-align: center; color: var(--ink); }
  .preview-card {
    width: min(360px, 90vw); border-radius: 20px; padding: 10px;
    background: var(--card-bg); border: 1px solid var(--border);
    box-shadow: 0 16px 36px rgba(6,42,94,0.16);
  }
  .preview-card img { display: block; width: 100%; height: auto; border-radius: 12px; }
  .meta-row { display: flex; gap: 8px; font-size: 12px; color: var(--ink-soft); }
  .meta-pill { padding: 4px 10px; border-radius: 999px; background: var(--blue-50); border: 1px solid var(--border); }
  .download-btn {
    appearance: none; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 12px;
    padding: 20px 44px; border-radius: 999px; font-size: 20px; font-weight: 800; color: var(--white);
    text-decoration: none;
    background: linear-gradient(180deg, var(--blue-500) 0%, var(--blue-700) 100%);
    box-shadow: 0 14px 28px rgba(6,42,94,0.4), inset 0 2px 2px rgba(255,255,255,0.55), inset 0 -6px 10px rgba(6,42,94,0.4);
  }
  .download-btn:active { transform: translateY(1px); }
</style>
