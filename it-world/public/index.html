<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT - World · Admin &amp; Ops</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="sidebar-brand" href="#/overview">
        <img src="/assets/logo.svg" alt="">
        <div>
          <div class="name gold-text">IT - WORLD</div>
          <div class="tag">Admin &amp; Ops</div>
        </div>
      </a>
      <nav class="nav" id="nav" aria-label="Hauptnavigation"></nav>
      <div class="sidebar-foot">IT - World · v1.0.0</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost btn-icon hamburger" id="menuToggle" aria-label="Menü öffnen">☰</button>
        <h1 id="pageTitle">Übersicht</h1>
        <div class="spacer"></div>
        <div class="live" title="Daten werden automatisch aktualisiert"><span>Live</span></div>
        <div class="user-chip" id="userChip" tabindex="0" role="button" aria-haspopup="menu">
          <div class="avatar" id="userAvatar"></div>
          <div class="who"><div class="uname" id="userName"></div><div class="urole" id="userRole"></div></div>
          <div class="menu hidden" id="userMenu" role="menu">
            <button type="button" data-cmd="password" role="menuitem">Passwort ändern</button>
            <button type="button" data-cmd="logout" role="menuitem">Abmelden</button>
          </div>
        </div>
      </header>
      <div id="banners"></div>
      <main class="content" id="content" tabindex="-1"></main>
    </div>
  </div>
  <div id="modalRoot"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
