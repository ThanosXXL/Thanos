<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><link rel="stylesheet" href="marketing.css"><link rel="stylesheet" href="fiverr-3d.css"><title>IT - World · 3D 2 Seiten</title>
<style>
  h2 { position: absolute; left: 0; right: 0; top: 34px; text-align: center; font-size: 50px; font-weight: 800; }

  .stage { position: absolute; left: 0; right: 0; top: 200px; height: 420px; transform-style: preserve-3d; }

</style></head><body>
  <canvas class="waves"></canvas>
  <div class="floor"></div>

    <div class="screen3d" style="left:400px;width:480px;top:10px;transform:translateZ(60px);z-index:2"><img src="screens/demo/overview.png" alt=""></div>

  <div class="lbl chip" style="left:50px">Tickets</div>
  <div class="lbl chip" style="left:285px">Monitoring</div>
  <div class="lbl chip" style="left:560px">Übersicht</div>
