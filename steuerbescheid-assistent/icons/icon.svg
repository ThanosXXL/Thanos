      <stop offset="35%" stop-color="#ffc633"/>
      <stop offset="75%" stop-color="#ff8a00"/>
      <stop offset="100%" stop-color="#e85d00"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
