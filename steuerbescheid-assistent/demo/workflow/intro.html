<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; font-family: "Segoe UI", Roboto, Arial, sans-serif; }
  body {
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 15% -10%, #fff6d8 0%, transparent 55%),
      radial-gradient(circle at 100% 0%, #ffcf80 0%, transparent 45%),
      linear-gradient(160deg, #fff2cf 0%, #ffdf9e 38%, #ffb559 75%, #ff9a3d 100%);
  }
  .wrap { text-align: center; }
  .logo {
    width: 220px; height: 220px; margin: 0 auto 28px;
    filter: drop-shadow(0 14px 24px rgba(163,69,0,0.35));
  }
  h1 {
    font-size: 64px; color: #fff; margin: 0 0 12px;
    text-shadow: 0 2px 0 rgba(0,0,0,0.25), 0 6px 18px rgba(0,0,0,0.2);
    letter-spacing: 0.5px;
  }
  p.tag {
    font-size: 26px; color: #4a2500; font-weight: 600; margin: 0 0 34px;
  }
  .badge {
    display: inline-block; padding: 14px 34px; border-radius: 999px;
    background: linear-gradient(180deg, #ffe066 0%, #ff8a00 55%, #e85d00 100%);
    color: #4a2500; font-weight: 800; font-size: 24px;
    box-shadow: 0 14px 28px rgba(163,69,0,0.28), 0 4px 8px rgba(163,69,0,0.18), inset 0 1px 0 rgba(255,255,255,0.75);
  }
  .platforms {
    margin-top: 40px; font-size: 20px; color: #5c3300; font-weight: 600;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bg" cx="35%" cy="25%" r="85%">
          <stop offset="0%" stop-color="#fff3cf"/>
          <stop offset="35%" stop-color="#ffc633"/>
          <stop offset="75%" stop-color="#ff8a00"/>
          <stop offset="100%" stop-color="#e85d00"/>
        </radialGradient>
        <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#fff4dc"/>
        </linearGradient>
      </defs>
      <rect width="512" height="512" rx="112" fill="url(#bg)"/>
      <g transform="translate(150,120)">
        <rect x="0" y="0" width="212" height="272" rx="20" fill="url(#paper)" stroke="#a34500" stroke-width="6"/>
        <rect x="28" y="40" width="156" height="18" rx="9" fill="#ffb347"/>
        <rect x="28" y="76" width="156" height="18" rx="9" fill="#ffd166"/>
        <rect x="28" y="112" width="100" height="18" rx="9" fill="#ffd166"/>
        <circle cx="150" cy="205" r="46" fill="#ff8a00" stroke="#a34500" stroke-width="5"/>
        <text x="150" y="222" font-size="46" font-weight="700" text-anchor="middle" fill="#fff8e1" font-family="Arial, sans-serif">&#8364;</text>
      </g>
    </svg>
    <h1>Steuerbescheid-Assistent</h1>
    <p class="tag">Schritt für Schritt zur eigenen Steuererklärung — ab Steuerjahr 2023</p>
    <span class="badge">DEMO</span>
    <div class="platforms">Windows &nbsp;·&nbsp; macOS &nbsp;·&nbsp; Linux &nbsp;·&nbsp; Android &nbsp;·&nbsp; iOS</div>
  </div>
</body>
</html>
