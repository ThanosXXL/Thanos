<figure class="slide s1" role="group" aria-label="1 von 6"><figcaption class="cap"><h2>ΠΑΡΑΔΟΣΙΑΚΟΙ ΧΟΡΟΙ</h2><p>Η Θράκη έχει να μας παρουσιάσει ένα δικό της ξεχωριστό και πολύ χαρακτηριστικό μάλιστα μουσικοχορευτικό ύφος και χρώμα, πράγμα που το διαπιστώνουμε όταν βλέπουμε τους υπέροχους Θρακιώτικους χορούς να χορεύονται.</p><a class="more" href="tanzgruppe.html">Μάθετε περισσότερα →</a></figcaption></figure>
<figure class="slide s2" role="group" aria-label="2 von 6"><figcaption class="cap"><h2>Trachten</h2><p>Die farbenfrohen Trachten Thrakiens, mit Stickereien und Westen, werden bei jedem Auftritt getragen.</p><a class="more" href="trachten.html">Μάθετε περισσότερα →</a></figcaption></figure>
<figure class="slide s3" role="group" aria-label="3 von 6"><figcaption class="cap"><h2>Tänze</h2><p>Thrakische Tänze in ihrer ursprünglichen Form, gemeinsam getanzt und weitergegeben.</p><a class="more" href="taenze.html">Μάθετε περισσότερα →</a></figcaption></figure>

<figure class="slide s5" role="group" aria-label="5 von 6"><figcaption class="cap"><h2>Geschichte</h2><p>Die Geschichte Thrakiens und des Vereins in Stuttgart.</p><a class="more" href="geschichte.html">Μάθετε περισσότερα →</a></figcaption></figure>
