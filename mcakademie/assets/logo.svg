<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="mcLogoTitle">
  <title id="mcLogoTitle">M&amp;C Akademie Logo</title>

  <defs>
    <linearGradient id="redGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5c56"/>
      <stop offset="30%" stop-color="#e2101b"/>
      <stop offset="100%" stop-color="#7c0a10"/>
    </linearGradient>

    <linearGradient id="blackGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d3d3d"/>
      <stop offset="35%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <linearGradient id="textGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="45%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="softDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <clipPath id="blackClip">
      <path d="M 175,258 A 330,108 0 0,1 825,258 A 330,50 0 0,0 175,258 Z"/>
    </clipPath>

    <clipPath id="redClip">
      <path d="M 175,258 A 330,120 0 0,0 825,258 A 330,52 0 0,1 175,258 Z"/>
    </clipPath>
  </defs>

  <g filter="url(#softDrop)">
    <!-- Rotes Band: aeusserer Bogen tief, innerer Bogen hoch, gemeinsame Spitzen links/rechts -->
    <path d="M 175,258 A 330,120 0 0,0 825,258 A 330,52 0 0,1 175,258 Z" fill="url(#redGloss)"/>

    <!-- Roter Schwung-Akzent links, geht nahtlos in das Band ueber -->
    <path d="M 175,258
             C 172,220 188,180 228,160
             C 252,148 272,150 278,164
             C 258,172 232,188 212,214
             C 198,232 190,246 186,260
             C 182,260 178,259 175,258 Z"
          fill="url(#redGloss)"/>

    <!-- Schwarzes Band: aeusserer Bogen hoch, innerer Bogen niedrig, gemeinsame Spitzen links/rechts -->
    <path d="M 175,258 A 330,108 0 0,1 825,258 A 330,50 0 0,0 175,258 Z" fill="url(#blackGloss)"/>

    <!-- Glanzstreifen, auf die jeweilige Bandform begrenzt -->
    <ellipse cx="500" cy="168" rx="260" ry="14" fill="url(#shine)" opacity="0.6" clip-path="url(#blackClip)"/>
    <ellipse cx="500" cy="320" rx="250" ry="16" fill="url(#shine)" opacity="0.4" clip-path="url(#redClip)"/>
  </g>

  <!-- Wortmarke -->
  <text x="506" y="273" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="48" fill="#000000" opacity="0.35" letter-spacing="1">
    M&amp;C <tspan font-style="italic">AKADEMIE</tspan>
  </text>
  <text x="505" y="272" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="48" fill="url(#textGloss)" letter-spacing="1">
    M&amp;C <tspan font-style="italic">AKADEMIE</tspan>
  </text>

  <!-- Pfeil-Unterstreichung -->
  <path d="M 401,299 L 606,299 L 589,283 M 606,299 L 589,315" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" transform="translate(0,1.5)"/>
  <path d="M 400,298 L 605,298 L 588,282 M 605,298 L 588,314" fill="none" stroke="url(#textGloss)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
