<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="mcLogoTitle">
  <title id="mcLogoTitle">M&amp;C Akademie Logo</title>

  <defs>
    <linearGradient id="blackGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="35%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <linearGradient id="redGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5c56"/>
      <stop offset="30%" stop-color="#e2101b"/>
      <stop offset="100%" stop-color="#7c0a10"/>
    </linearGradient>

    <linearGradient id="textGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="45%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="softDrop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <clipPath id="blackClip">
      <path d="M 85,158 C 130,60 220,42 300,50 C 400,40 500,55 558,165 C 495,120 400,88 300,92 C 210,88 130,108 85,158 Z"/>
    </clipPath>

    <clipPath id="redClip">
      <path d="M 92,185 C 140,275 240,298 320,292 C 420,300 500,272 552,178 C 480,232 400,252 315,248 C 220,252 140,232 92,185 Z"/>
    </clipPath>
  </defs>

  <g filter="url(#softDrop)">
    <!-- Schwarzes Schwung-Band (oben), glaenzend -->
    <path d="M 85,158
             C 130,60 220,42 300,50
             C 400,40 500,55 558,165
             C 495,120 400,88 300,92
             C 210,88 130,108 85,158 Z"
          fill="url(#blackGloss)"/>
    <ellipse cx="300" cy="72" rx="220" ry="16" fill="url(#shine)" opacity="0.55" clip-path="url(#blackClip)"/>

    <!-- Rotes Schwung-Band (unten), glaenzend -->
    <path d="M 92,185
             C 140,275 240,298 320,292
             C 420,300 500,272 552,178
             C 480,232 400,252 315,248
             C 220,252 140,232 92,185 Z"
          fill="url(#redGloss)"/>
    <ellipse cx="320" cy="205" rx="200" ry="14" fill="url(#shine)" opacity="0.5" clip-path="url(#redClip)"/>
  </g>

  <!-- Wortmarke, glaenzend mit leichtem Relief -->
  <text x="301" y="151" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="52" fill="#000000" opacity="0.35" letter-spacing="1">
    M&amp;C <tspan font-style="italic">AKADEMIE</tspan>
  </text>
  <text x="300" y="150" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="52" fill="url(#textGloss)" letter-spacing="1">
    M&amp;C <tspan font-style="italic">AKADEMIE</tspan>
  </text>

  <!-- Pfeil-Unterstreichung, mit Tiefe -->
  <path d="M 235,183 L 430,183 L 415,169 M 430,183 L 415,197" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" transform="translate(0,1.5)"/>
  <path d="M 235,182 L 430,182 L 415,168 M 430,182 L 415,196" fill="none" stroke="url(#textGloss)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
