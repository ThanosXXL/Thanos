<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bauplanphase — Live-Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171c; --bg-blueprint:#171b21; --panel:#1e232b; --line:#333b46;
    --text:#eef1f4; --text-dim:#8d97a3; --orange:#f2660c; --orange-light:#ff9143; --orange-dark:#c74e00;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; }
  body{
    background:var(--bg);
    background-image:
      linear-gradient(var(--bg-blueprint) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-blueprint) 1px, transparent 1px);
    background-size:28px 28px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:32px 16px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    max-width:420px; width:100%;
    text-align:center;
  }
  .brand-mark{
    width:56px; height:56px; margin:0 auto 18px;
    border-radius:14px;
    background:linear-gradient(135deg, var(--orange-light), var(--orange) 60%, var(--orange-dark));
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; color:#fff;
    box-shadow:0 10px 26px rgba(242,102,12,0.35), inset 0 2px 0 rgba(255,255,255,0.45), inset 0 -6px 10px rgba(0,0,0,0.25);
  }
  h1{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:28px;
    margin-bottom:8px;
  }
  h1 span{ color:var(--orange); }
  p.sub{
    color:var(--text-dim); font-size:14px; line-height:1.6;
    max-width:340px; margin:0 auto 30px;
  }

  .video-frame{
    border-radius:16px; overflow:hidden; border:1px solid var(--line);
    box-shadow:0 20px 50px rgba(0,0,0,0.45);
    margin-bottom:30px;
    background:#000;
    height:260px;
  }
  .video-frame video{ display:block; width:100%; height:100%; object-fit:cover; object-position:top center; }

  /* ---------- 3D Glossy 1-Klick-Button ---------- */
  .cta{
    --h: 58px;
    position:relative;
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    width:100%; max-width:300px;
    height:var(--h);
    border-radius:999px;
    border:none;
    cursor:pointer;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:17px;
    letter-spacing:0.2px;
    color:#fff;
    text-decoration:none;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 45%),
      linear-gradient(180deg, var(--orange-light) 0%, var(--orange) 48%, var(--orange-dark) 100%);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.6) inset,
      0 -10px 16px rgba(0,0,0,0.28) inset,
      0 14px 0 var(--orange-dark),
      0 22px 34px rgba(242,102,12,0.45);
    transform:translateY(0);
    transition:transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
  }
  .cta::after{
    content:"";
    position:absolute; top:6%; left:8%; right:8%; height:34%;
    border-radius:999px;
    background:linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255,255,255,0));
    filter:blur(1px);
    pointer-events:none;
  }
  .cta:hover{ filter:brightness(1.06); }
  .cta:active{
    transform:translateY(10px);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.5) inset,
      0 -6px 10px rgba(0,0,0,0.3) inset,
      0 4px 0 var(--orange-dark),
      0 8px 16px rgba(242,102,12,0.4);
  }
  .cta svg{ flex-shrink:0; }

  .cta-note{
    margin-top:16px;
    font-size:11px;
    color:var(--text-dim);
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .cta-note .dot{
    width:6px; height:6px; border-radius:50%; background:#3fae7a;
    box-shadow:0 0 0 3px rgba(63,174,122,0.2);
  }

  footer{ margin-top:34px; font-size:11px; color:var(--text-dim); }
  footer a{ color:var(--orange); text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand-mark">BP</div>
    <h1>Bauplan<span>phase</span></h1>
    <p class="sub">Tagesreport, Status, Bestellstatus und Screenshots — alles anklickbar, direkt im Browser. Keine Installation nötig.</p>

    <div class="video-frame">
      <video autoplay loop muted playsinline preload="metadata">
        <source src="assets/bauplanphase-demo.webm" type="video/webm">
      </video>
    </div>

    <a class="cta" href="demo.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M8 5v14l11-7L8 5z" fill="currentColor"/></svg>
      Demo starten
    </a>
    <div class="cta-note"><span class="dot"></span> Ein Klick — läuft sofort im Browser</div>

    <footer>Live-Demo · <a href="demo.html">direkt öffnen</a></footer>
  </div>
</body>
</html>
