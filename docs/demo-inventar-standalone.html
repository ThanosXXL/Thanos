<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Inventar - Dashboard – Demo (Offline)</title>
<meta name="description" content="Interaktive Demo des Inventar - Dashboards mit Beispieldaten – läuft direkt im Browser, keine Installation nötig.">
<style>
:root {
  --white: #ffffff;
  --black: #111111;
  --danger: #b3261e;

  /* Inventar - Dashboard: Gold/Braun, glänzend, 3D */
  --gold: #d4af37;
  --gold-light: #f4e2a8;
  --gold-bright: #f7d774;
  --bronze: #8a5a2b;
  --bronze-dark: #5c3a1a;
  --dark-brown: #3b2410;
}

* {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(160deg, #fbf6e9, var(--white) 45%, #f3e6c8 100%);
  color: var(--black);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.app-header {
  background: linear-gradient(135deg, var(--bronze-dark), var(--bronze) 45%, var(--gold) 100%);
  box-shadow: 0 3px 10px rgba(59, 36, 16, 0.4), inset 0 -2px 0 rgba(255, 255, 255, 0.25);
  color: var(--white);
  padding: 16px 24px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.app-header h1 {
  margin: 0;
  font-size: 22px;
  letter-spacing: 0.5px;
}

main#content {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  background: transparent;
}

.empty-state {
  text-align: center;
  margin-top: 100px;
  color: #444;
}

.icon-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 14px;
  padding: 2px 6px;
  border-radius: 4px;
  color: var(--bronze-dark);
}

.icon-btn.danger {
  color: var(--danger);
}

.icon-btn:hover {
  background: var(--gold-light);
}

.btn-secondary {
  background: var(--white);
  color: var(--bronze-dark);
  border: 1px solid var(--bronze);
  padding: 9px 18px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
}

.btn-danger {
  background: var(--danger);
  color: var(--white);
  border: none;
  padding: 9px 18px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
}

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(59, 36, 16, 0.5);
  align-items: center;
  justify-content: center;
  z-index: 10;
}

.modal-overlay.visible {
  display: flex;
}

.modal {
  background: var(--white);
  color: var(--black);
  border-radius: 10px;
  padding: 24px;
  width: 360px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
}

.modal h2 {
  margin-top: 0;
  color: var(--bronze-dark);
}

.modal input {
  width: 100%;
  padding: 9px 10px;
  border: 1px solid #b9c6d9;
  border-radius: 6px;
  font-size: 14px;
  margin-bottom: 14px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

/* ============================================================
   Inventar - Dashboard: Gold/Braun, glänzend weiß, 3D-Stil
   ============================================================ */

.inventar-toolbar {
  display: flex;
  align-items: center;
  gap: 16px;
  background: linear-gradient(180deg, var(--gold-light), var(--gold) 100%);
  padding: 12px 16px;
  border-bottom: 2px solid var(--bronze);
  flex-shrink: 0;
}

.inventar-toolbar-hint {
  color: var(--bronze-dark);
  font-size: 13px;
  font-style: italic;
}

.admin-toggle-btn {
  margin-left: auto;
}

.admin-toggle-btn.active {
  background: linear-gradient(180deg, #d9f0d9, #a8dba8 100%);
  box-shadow: 0 3px 0 #4b7a4b, 0 5px 8px rgba(59, 36, 16, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.8);
}

.nachbestellung-reminder {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  background: linear-gradient(135deg, var(--gold-bright), var(--gold) 55%, var(--bronze) 100%);
  color: var(--dark-brown);
  border: 2px solid var(--bronze-dark);
  border-radius: 12px;
  padding: 14px 18px;
  margin-bottom: 20px;
  font-weight: 600;
  font-size: 14px;
  box-shadow: 0 6px 16px rgba(59, 36, 16, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.6);
  animation: reminder-pulse 2.2s ease-in-out infinite;
}

@keyframes reminder-pulse {
  0%, 100% { box-shadow: 0 6px 16px rgba(59, 36, 16, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.6); }
  50% { box-shadow: 0 6px 22px rgba(179, 38, 30, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.6); }
}

.admin-panel {
  background: linear-gradient(180deg, #fffdf6, var(--gold-light) 160%);
  border: 2px solid var(--gold);
  border-radius: 12px;
  padding: 18px 20px;
  margin-bottom: 22px;
  box-shadow: 0 8px 22px rgba(59, 36, 16, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.85);
}

.admin-panel h2 {
  margin: 0 0 14px;
  color: var(--bronze-dark);
  font-size: 17px;
}

.admin-grid {
  display: grid;
  grid-template-columns: 1fr 1.6fr;
  gap: 18px;
}

.admin-card {
  background: rgba(255, 255, 255, 0.7);
  border: 1px solid var(--gold);
  border-radius: 10px;
  padding: 14px 16px;
}

.admin-card h3 {
  margin: 0 0 10px;
  color: var(--bronze-dark);
  font-size: 14px;
}

.admin-download-list {
  list-style: none;
  margin: 0;
  padding: 0;
  font-size: 13px;
}

.admin-download-list li {
  margin-bottom: 8px;
}

.admin-download-list a {
  color: var(--bronze-dark);
  font-weight: 600;
  text-decoration: none;
}

.admin-download-list a:hover {
  text-decoration: underline;
}

.admin-nb-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin-bottom: 12px;
}

.admin-nb-table th,
.admin-nb-table td {
  text-align: left;
  padding: 6px 8px;
  border-bottom: 1px solid var(--gold-light);
}

.admin-nb-table select {
  padding: 4px 6px;
  border-radius: 6px;
  border: 1px solid var(--bronze);
  font-size: 12px;
}

.admin-nb-add-row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.admin-nb-add-row select {
  flex: 1;
  min-width: 140px;
  padding: 7px 8px;
  border-radius: 6px;
  border: 1px solid var(--bronze);
  font-size: 13px;
}

@media (max-width: 900px) {
  .admin-grid {
    grid-template-columns: 1fr;
  }
}

/* Glänzende 3D-Buttons im Gold/Braun-Stil */
.btn-gold,
.btn-gold-outline {
  border: none;
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  cursor: pointer;
  position: relative;
}

.btn-gold {
  color: var(--dark-brown);
  font-weight: 600;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.05) 45%, rgba(255, 255, 255, 0) 100%),
    linear-gradient(135deg, var(--gold-bright), var(--gold) 55%, var(--bronze) 100%);
  box-shadow:
    0 4px 0 var(--bronze-dark),
    0 6px 10px rgba(59, 36, 16, 0.35),
    inset 0 1px 0 rgba(255, 255, 255, 0.6);
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}

.btn-gold:hover {
  filter: brightness(1.05);
}

.btn-gold:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--bronze-dark), 0 2px 4px rgba(59, 36, 16, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.6);
}

.btn-gold-outline {
  color: var(--bronze-dark);
  font-weight: 600;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), var(--gold-light) 100%);
  box-shadow: 0 3px 0 var(--bronze), 0 5px 8px rgba(59, 36, 16, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.8);
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}

.btn-gold-outline:hover {
  filter: brightness(1.03);
}

.btn-gold-outline:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 var(--bronze), 0 2px 4px rgba(59, 36, 16, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.8);
}

.btn-gold-outline.small {
  padding: 6px 12px;
  font-size: 12px;
}

.btn-gold-outline:disabled,
.btn-gold:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  filter: none;
}

/* Inventar-Tabelle */
.inventar-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 10px;
}

.inventar-table thead th {
  text-align: left;
  color: var(--dark-brown);
  background: linear-gradient(180deg, var(--gold-bright), var(--gold) 100%);
  padding: 10px 14px;
  font-size: 13px;
  letter-spacing: 0.3px;
  border-bottom: 2px solid var(--bronze);
}

.inventar-table thead th:first-child {
  border-top-left-radius: 8px;
  border-bottom-left-radius: 8px;
}

.inventar-table thead th:last-child {
  border-top-right-radius: 8px;
  border-bottom-right-radius: 8px;
}

.inventar-table tbody tr {
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.1) 60%, rgba(255, 255, 255, 0) 100%),
    var(--white);
  box-shadow: 0 3px 8px rgba(59, 36, 16, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.9);
}

.inventar-table tbody tr.low-stock {
  box-shadow: 0 3px 8px rgba(179, 38, 30, 0.25), inset 0 0 0 2px rgba(179, 38, 30, 0.35);
}

.inventar-table td {
  padding: 12px 14px;
  color: var(--black);
  font-size: 14px;
}

.inventar-table tbody tr td:first-child {
  border-top-left-radius: 8px;
  border-bottom-left-radius: 8px;
}

.inventar-table tbody tr td:last-child {
  border-top-right-radius: 8px;
  border-bottom-right-radius: 8px;
}

.geraet-cell {
  display: flex;
  align-items: center;
  gap: 10px;
}

.geraet-thumb {
  width: 40px;
  height: 40px;
  object-fit: cover;
  border-radius: 6px;
  box-shadow: 0 2px 4px rgba(59, 36, 16, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.6);
}

.zustand-badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
}

.zustand-badge.ovp {
  background: linear-gradient(180deg, var(--gold-bright), var(--gold));
  color: var(--dark-brown);
}

.zustand-badge.gebraucht {
  background: #e6d9c2;
  color: var(--bronze-dark);
}

.stueckzahl-input {
  width: 64px;
  padding: 6px 8px;
  border: 1px solid var(--bronze);
  border-radius: 6px;
  font-size: 14px;
  text-align: center;
}

.low-stock-badge {
  display: inline-block;
  margin-left: 8px;
  padding: 3px 8px;
  border-radius: 10px;
  background: var(--danger);
  color: var(--white);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}

.actions-cell {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Modal im Gold-Stil */
.modal-gold {
  background: linear-gradient(180deg, #fffdf6, var(--gold-light) 130%);
  box-shadow: 0 10px 30px rgba(59, 36, 16, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.9);
  border: 1px solid var(--gold);
}

.modal-gold h2 {
  color: var(--bronze-dark);
}

.modal-wide {
  width: 460px;
  max-height: 88vh;
  overflow-y: auto;
}

.inventar-form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 14px;
  margin-bottom: 16px;
}

.inventar-form-grid label,
.modal-gold label {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13px;
  color: var(--bronze-dark);
  font-weight: 600;
  margin-bottom: 10px;
}

.inventar-form-grid input,
.inventar-form-grid select,
.modal-gold input {
  font-family: inherit;
  padding: 8px 10px;
  border: 1px solid var(--bronze);
  border-radius: 6px;
  font-size: 14px;
  font-weight: 400;
  color: var(--black);
}

.input-with-mic {
  display: flex;
  gap: 6px;
}

.input-with-mic input {
  flex: 1;
}

.mic-btn {
  border: 1px solid var(--bronze);
  background: linear-gradient(180deg, #fff, var(--gold-light));
  border-radius: 6px;
  cursor: pointer;
  font-size: 15px;
  padding: 0 10px;
}

.mic-btn.listening {
  background: linear-gradient(180deg, var(--danger), #7d1a14);
  color: var(--white);
  animation: mic-pulse 1s infinite;
}

@keyframes mic-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(179, 38, 30, 0.5); }
  50% { box-shadow: 0 0 0 6px rgba(179, 38, 30, 0); }
}

.foto-section {
  border-top: 1px dashed var(--bronze);
  padding-top: 14px;
  margin-bottom: 8px;
}

.foto-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  font-weight: 600;
  color: var(--bronze-dark);
  font-size: 13px;
}

#invCameraPreview,
#invCapturedPhoto {
  width: 100%;
  max-height: 240px;
  object-fit: cover;
  border-radius: 8px;
  box-shadow: 0 4px 10px rgba(59, 36, 16, 0.3), inset 0 0 0 1px rgba(255, 255, 255, 0.6);
  margin-bottom: 10px;
  background: #000;
}

.foto-actions {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

.recognition-box {
  background: linear-gradient(180deg, #fffdf6, var(--gold-light));
  border: 1px solid var(--gold);
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 10px;
}

.recognition-box p {
  margin: 0 0 10px 0;
  color: var(--dark-brown);
  font-size: 14px;
}

.foto-status {
  font-size: 12px;
  color: var(--bronze-dark);
  min-height: 16px;
}

/* Erinnerungs-Toast nach Ausgabe */
.toast-reminder {
  position: fixed;
  bottom: 24px;
  right: 24px;
  max-width: 340px;
  background: linear-gradient(135deg, var(--gold-bright), var(--gold) 60%, var(--bronze) 100%);
  color: var(--dark-brown);
  font-weight: 600;
  font-size: 13px;
  padding: 14px 18px;
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(59, 36, 16, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.6);
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.25s ease, transform 0.25s ease;
  z-index: 50;
}

.toast-reminder.visible {
  opacity: 1;
  transform: translateY(0);
}

.toast-reminder.warning {
  background: linear-gradient(135deg, #e08a3c, var(--danger) 90%);
  color: var(--white);
}

@media (max-width: 900px) {
  .inventar-form-grid {
    grid-template-columns: 1fr;
  }
}

/* Demo-Modus-Hinweis */
.demo-ribbon {
  flex-shrink: 0;
  width: 100%;
  text-align: center;
  background: linear-gradient(90deg, var(--bronze-dark), var(--gold) 50%, var(--bronze-dark));
  color: #fffdf6;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.3px;
  padding: 6px 10px;
  box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.15);
}

</style>
<style>
  .demo-toolbar {
    position: fixed;
    left: 12px;
    bottom: 12px;
    z-index: 60;
    display: flex;
    gap: 8px;
  }
  .demo-toolbar a,
  .demo-toolbar button {
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    background: linear-gradient(180deg, #fffdf6, #f4e2a8);
    color: #3b2410;
    box-shadow: 0 3px 8px rgba(59, 36, 16, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.8);
  }
</style>
</head>
<body>
  <header class="app-header">
    <h1 id="appTitle">Inventar - Dashboard</h1>
  </header>

  <nav class="inventar-toolbar" id="inventarToolbar">
    <button type="button" class="btn-gold" id="addInventarBtn">+ Neues Gerät</button>
    <span class="inventar-toolbar-hint">Erfassung per Tastatur, Mikrofon 🎤 oder Foto 📷</span>
    <button type="button" class="btn-gold-outline admin-toggle-btn" id="adminModeBtn">🔒 Admin-Modus</button>
  </nav>

  <main id="content"></main>

  <!-- Modal: Neues Inventar-Gerät erfassen -->
  <div class="modal-overlay" id="addInventarModal">
    <div class="modal modal-gold modal-wide">
      <h2>Neues Gerät erfassen</h2>

      <div class="inventar-form-grid">
        <label>Gerät
          <div class="input-with-mic">
            <input type="text" id="invGeraet" placeholder="z. B. Laptop" maxlength="80">
            <button type="button" class="mic-btn" id="invGeraetMic" title="Diktieren">🎤</button>
          </div>
        </label>

        <label>Hersteller
          <div class="input-with-mic">
            <input type="text" id="invHersteller" placeholder="z. B. Dell" maxlength="80">
            <button type="button" class="mic-btn" id="invHerstellerMic" title="Diktieren">🎤</button>
          </div>
        </label>

        <label>Zustand
          <select id="invZustand">
            <option value="OVP">OVP (originalverpackt)</option>
            <option value="Gebraucht">Gebraucht</option>
          </select>
        </label>

        <label>Stückzahl
          <input type="number" id="invStueckzahl" min="0" step="1" value="1">
        </label>
      </div>

      <div class="foto-section">
        <div class="foto-section-head">
          <span>Foto-Erkennung</span>
          <button type="button" class="btn-gold-outline" id="invStartCamera">📷 Kamera starten</button>
        </div>
        <video id="invCameraPreview" autoplay playsinline hidden></video>
        <canvas id="invCameraCanvas" hidden></canvas>
        <img id="invCapturedPhoto" alt="Aufgenommenes Foto" hidden>
        <div class="foto-actions" id="invCameraActions" hidden>
          <button type="button" class="btn-gold-outline" id="invCapturePhoto">Foto aufnehmen</button>
          <button type="button" class="btn-secondary" id="invCancelCamera">Abbrechen</button>
        </div>
        <div class="recognition-box" id="invRecognitionBox" hidden>
          <p id="invRecognitionText"></p>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="invRecognitionNo">Nein, korrigieren</button>
            <button type="button" class="btn-gold" id="invRecognitionYes">Ja, übernehmen</button>
          </div>
        </div>
        <p class="foto-status" id="invFotoStatus"></p>
      </div>

      <div class="modal-actions">
        <button id="cancelAddInventar" class="btn-secondary">Abbrechen</button>
        <button id="confirmAddInventar" class="btn-gold">Gerät speichern</button>
      </div>
    </div>
  </div>

  <!-- Modal: Gerät an Kollegen/Kunden ausgeben -->
  <div class="modal-overlay" id="ausgabeModal">
    <div class="modal modal-gold">
      <h2>Gerät ausgeben</h2>
      <p id="ausgabeGeraetText"></p>
      <label>Menge
        <input type="number" id="ausgabeMenge" min="1" step="1" value="1">
      </label>
      <label>Ausgegeben an (Kollege/Kunde)
        <input type="text" id="ausgabeEmpfaenger" placeholder="Name (optional)" maxlength="80">
      </label>
      <div class="modal-actions">
        <button id="cancelAusgabe" class="btn-secondary">Abbrechen</button>
        <button id="confirmAusgabe" class="btn-gold">Ausgeben</button>
      </div>
    </div>
  </div>

  <!-- Modal: Inventar-Gerät löschen bestätigen -->
  <div class="modal-overlay" id="deleteInventarModal">
    <div class="modal modal-gold">
      <h2>Gerät entfernen?</h2>
      <p id="deleteInventarText"></p>
      <div class="modal-actions">
        <button id="cancelDeleteInventar" class="btn-secondary">Abbrechen</button>
        <button id="confirmDeleteInventar" class="btn-danger">Entfernen</button>
      </div>
    </div>
  </div>

  <!-- Modal: Admin-PIN eingeben -->
  <div class="modal-overlay" id="adminPinModal">
    <div class="modal modal-gold">
      <h2>Admin-PIN eingeben</h2>
      <p id="adminPinHint" class="foto-status"></p>
      <label>PIN
        <input type="password" id="adminPinInput" maxlength="20" inputmode="numeric" autocomplete="off">
      </label>
      <p class="foto-status" id="adminPinError" style="color: var(--danger);"></p>
      <div class="modal-actions">
        <button id="cancelAdminPin" class="btn-secondary">Abbrechen</button>
        <button id="confirmAdminPin" class="btn-gold">Bestätigen</button>
      </div>
    </div>
  </div>

  <div class="demo-toolbar">
    <span>Eigenständige Offline-Demo</span>
    <button type="button" id="demoResetBtn">🔄 Demo zurücksetzen</button>
  </div>

  <script>
// Browser-Demo-Shim für die Inventar-Demo. Ersetzt window.dashboardAPI durch eine
// localStorage-gestützte Version und seedet Beispieldaten beim ersten Aufruf.
(function () {
  window.__DASHBOARD_DEMO__ = true;

  const STORAGE_KEY = 'inventarDashboardDemoState';

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function seedState() {
    const now = new Date().toLocaleString('de-DE', {
      day: '2-digit',
      month: '2-digit',
      hour: '2-digit',
      minute: '2-digit'
    });

    return {
      inventar: [
        { id: uid(), geraet: 'Laptop', hersteller: 'Dell', zustand: 'OVP', stueckzahl: 8, photo: null, ausgaben: [], nachbestellungen: [] },
        {
          id: uid(),
          geraet: 'Beamer',
          hersteller: 'Epson',
          zustand: 'Gebraucht',
          stueckzahl: 2,
          photo: null,
          ausgaben: [{ id: uid(), menge: 2, empfaenger: 'Max Mustermann', datum: now }],
          nachbestellungen: []
        },
        { id: uid(), geraet: 'Tastatur', hersteller: 'Logitech', zustand: 'OVP', stueckzahl: 15, photo: null, ausgaben: [], nachbestellungen: [] },
        { id: uid(), geraet: 'Smartphone', hersteller: 'Samsung', zustand: 'Gebraucht', stueckzahl: 1, photo: null, ausgaben: [], nachbestellungen: [] }
      ]
    };
  }

  window.dashboardAPI = {
    loadData: () =>
      Promise.resolve().then(() => {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          try {
            return JSON.parse(raw);
          } catch (err) {
            /* fällt durch auf Beispieldaten */
          }
        }
        const seed = seedState();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seed));
        return seed;
      }),
    saveData: (data) =>
      Promise.resolve().then(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        return true;
      })
  };
})();

  <script>
(function () {
  const LOW_STOCK_THRESHOLD = 3;
  const NACHBESTELLUNG_REMINDER_DAYS = [2, 5]; // 2 = Dienstag, 5 = Freitag (JS: Sonntag = 0)
  const NACHBESTELLUNG_REMINDER_HOUR = 10;

  let state = { inventar: [] };

  const content = document.getElementById('content');

  // ---- Inventar: DOM-Referenzen ----
  const addInventarBtn = document.getElementById('addInventarBtn');
  const addInventarModal = document.getElementById('addInventarModal');
  const invGeraet = document.getElementById('invGeraet');
  const invGeraetMic = document.getElementById('invGeraetMic');
  const invHersteller = document.getElementById('invHersteller');
  const invHerstellerMic = document.getElementById('invHerstellerMic');
  const invZustand = document.getElementById('invZustand');
  const invStueckzahl = document.getElementById('invStueckzahl');
  const invStartCamera = document.getElementById('invStartCamera');
  const invCameraPreview = document.getElementById('invCameraPreview');
  const invCameraCanvas = document.getElementById('invCameraCanvas');
  const invCapturedPhoto = document.getElementById('invCapturedPhoto');
  const invCameraActions = document.getElementById('invCameraActions');
  const invCapturePhotoBtn = document.getElementById('invCapturePhoto');
  const invCancelCameraBtn = document.getElementById('invCancelCamera');
  const invRecognitionBox = document.getElementById('invRecognitionBox');
  const invRecognitionText = document.getElementById('invRecognitionText');
  const invRecognitionYesBtn = document.getElementById('invRecognitionYes');
  const invRecognitionNoBtn = document.getElementById('invRecognitionNo');
  const invFotoStatus = document.getElementById('invFotoStatus');
  const cancelAddInventarBtn = document.getElementById('cancelAddInventar');
  const confirmAddInventarBtn = document.getElementById('confirmAddInventar');

  const ausgabeModal = document.getElementById('ausgabeModal');
  const ausgabeGeraetText = document.getElementById('ausgabeGeraetText');
  const ausgabeMenge = document.getElementById('ausgabeMenge');
  const ausgabeEmpfaenger = document.getElementById('ausgabeEmpfaenger');
  const cancelAusgabeBtn = document.getElementById('cancelAusgabe');
  const confirmAusgabeBtn = document.getElementById('confirmAusgabe');
  let pendingAusgabeId = null;

  const deleteInventarModal = document.getElementById('deleteInventarModal');
  const deleteInventarText = document.getElementById('deleteInventarText');
  const cancelDeleteInventarBtn = document.getElementById('cancelDeleteInventar');
  const confirmDeleteInventarBtn = document.getElementById('confirmDeleteInventar');
  let pendingDeleteInventarId = null;

  // ---- Admin-Modus ----
  // Feste PINs für bis zu 4 Admins (kein Einrichtungsschritt) – jede der vier PINs
  // schaltet den Admin-Modus frei. Das ist bewusst eine einfache lokale Klick-Sperre,
  // keine echte Benutzer-Authentifizierung (siehe Admin-Handbuch).
  const ADMIN_PINS = ['2894', '7059', '0361', '4302'];

  const adminModeBtn = document.getElementById('adminModeBtn');
  const adminPinModal = document.getElementById('adminPinModal');
  const adminPinHint = document.getElementById('adminPinHint');
  const adminPinInput = document.getElementById('adminPinInput');
  const adminPinError = document.getElementById('adminPinError');
  const cancelAdminPinBtn = document.getElementById('cancelAdminPin');
  const confirmAdminPinBtn = document.getElementById('confirmAdminPin');
  let isAdmin = false; // gilt nur für die aktuelle Sitzung, wird nicht gespeichert

  const DOWNLOAD_LINKS = [
    { label: 'Windows – Installer (.exe)', url: 'https://github.com/ThanosXXL/Thanos/releases/latest/download/InventarDashboard-Setup.exe' },
    { label: 'Windows – 1-Klick-Downloader-App', url: 'https://github.com/ThanosXXL/Thanos/releases/latest/download/InventarDashboard-Downloader.exe' },
    { label: 'macOS (.dmg)', url: 'https://github.com/ThanosXXL/Thanos/releases/latest/download/InventarDashboard.dmg' },
    { label: 'Linux (.AppImage)', url: 'https://github.com/ThanosXXL/Thanos/releases/latest/download/InventarDashboard.AppImage' }
  ];

  let cameraStream = null;
  let capturedPhotoDataUrl = null;
  let recognizedLabel = null;

  const isDemoMode =
    new URLSearchParams(window.location.search).get('demo') === '1' || window.__DASHBOARD_DEMO__ === true;
  if (isDemoMode) {
    document.title = 'Inventar - Dashboard – DEMO';
    const ribbon = document.createElement('div');
    ribbon.className = 'demo-ribbon';
    ribbon.textContent = '🧪 DEMO-VERSION – Beispieldaten, keine echten Daten';
    document.body.insertBefore(ribbon, document.body.firstChild);
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function persist() {
    window.dashboardAPI.saveData(state);
  }

  // ================= Inventar =================

  function findInventarItem(id) {
    return state.inventar.find((i) => i.id === id);
  }

  function showToast(message, variant) {
    const toast = document.createElement('div');
    toast.className = 'toast-reminder' + (variant ? ' ' + variant : '');
    toast.textContent = message;
    document.body.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('visible'));
    setTimeout(() => {
      toast.classList.remove('visible');
      setTimeout(() => toast.remove(), 300);
    }, 5000);
  }

  function stopCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach((t) => t.stop());
      cameraStream = null;
    }
    invCameraPreview.srcObject = null;
    invCameraPreview.hidden = true;
    invCameraActions.hidden = true;
  }

  function resetInventarForm() {
    invGeraet.value = '';
    invHersteller.value = '';
    invZustand.value = 'OVP';
    invStueckzahl.value = '1';
    invCapturedPhoto.hidden = true;
    invCapturedPhoto.src = '';
    invRecognitionBox.hidden = true;
    invFotoStatus.textContent = '';
    capturedPhotoDataUrl = null;
    recognizedLabel = null;
    stopCamera();
  }

  function openAddInventarModal() {
    resetInventarForm();
    addInventarModal.classList.add('visible');
    invGeraet.focus();
  }

  function closeAddInventarModal() {
    stopCamera();
    addInventarModal.classList.remove('visible');
  }

  function confirmAddInventar() {
    const geraet = invGeraet.value.trim();
    const hersteller = invHersteller.value.trim();
    const zustand = invZustand.value;
    const stueckzahl = Math.max(0, parseInt(invStueckzahl.value, 10) || 0);
    if (!geraet) {
      invGeraet.focus();
      return;
    }

    state.inventar.push({
      id: uid(),
      geraet,
      hersteller,
      zustand,
      stueckzahl,
      photo: capturedPhotoDataUrl,
      ausgaben: [],
      nachbestellungen: []
    });
    persist();
    closeAddInventarModal();
    render();
  }

  function openDeleteInventarModal(id) {
    const item = findInventarItem(id);
    if (!item) return;
    pendingDeleteInventarId = id;
    deleteInventarText.textContent = `Soll "${item.geraet}" wirklich aus dem Inventar entfernt werden?`;
    deleteInventarModal.classList.add('visible');
  }

  function closeDeleteInventarModal() {
    pendingDeleteInventarId = null;
    deleteInventarModal.classList.remove('visible');
  }

  function confirmDeleteInventar() {
    if (!pendingDeleteInventarId) return;
    state.inventar = state.inventar.filter((i) => i.id !== pendingDeleteInventarId);
    persist();
    closeDeleteInventarModal();
    render();
  }

  // ---- Admin-Modus ----

  function updateAdminToggleButton() {
    if (isAdmin) {
      adminModeBtn.textContent = '🔓 Admin-Modus verlassen';
      adminModeBtn.classList.add('active');
    } else {
      adminModeBtn.textContent = '🔒 Admin-Modus';
      adminModeBtn.classList.remove('active');
    }
  }

  function openAdminPinModal() {
    adminPinInput.value = '';
    adminPinError.textContent = '';
    adminPinHint.textContent = 'Downloads für Admins und Nachbestellungen sind nur im Admin-Modus verfügbar.';
    adminPinModal.classList.add('visible');
    adminPinInput.focus();
  }

  function closeAdminPinModal() {
    adminPinModal.classList.remove('visible');
  }

  function confirmAdminPin() {
    const pin = adminPinInput.value.trim();
    if (!ADMIN_PINS.includes(pin)) {
      adminPinError.textContent = 'Falsche PIN.';
      return;
    }
    isAdmin = true;
    closeAdminPinModal();
    render();
  }

  function toggleAdminMode() {
    if (isAdmin) {
      isAdmin = false;
      render();
      return;
    }
    openAdminPinModal();
  }

  // ---- Nachbestellungen (nur im Admin-Modus möglich) ----

  function addNachbestellung(itemId, menge) {
    if (!isAdmin) return;
    const item = findInventarItem(itemId);
    if (!item) return;
    const val = Math.max(1, parseInt(menge, 10) || 0);
    if (!Array.isArray(item.nachbestellungen)) item.nachbestellungen = [];
    item.nachbestellungen.push({
      id: uid(),
      menge: val,
      status: 'offen',
      datum: new Date().toLocaleString('de-DE', {
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      })
    });
    persist();
    render();
  }

  function updateNachbestellungStatus(itemId, nbId, status) {
    if (!isAdmin) return;
    const item = findInventarItem(itemId);
    if (!item) return;
    const nb = (item.nachbestellungen || []).find((n) => n.id === nbId);
    if (!nb) return;
    nb.status = status;
    persist();
    render();
  }

  function deleteNachbestellung(itemId, nbId) {
    if (!isAdmin) return;
    const item = findInventarItem(itemId);
    if (!item) return;
    item.nachbestellungen = (item.nachbestellungen || []).filter((n) => n.id !== nbId);
    persist();
    render();
  }

  function countOpenNachbestellungen() {
    let count = 0;
    state.inventar.forEach((item) => {
      (item.nachbestellungen || []).forEach((nb) => {
        if (nb.status !== 'erledigt') count += 1;
      });
    });
    return count;
  }

  function isNachbestellungReminderTime() {
    const now = new Date();
    return NACHBESTELLUNG_REMINDER_DAYS.includes(now.getDay()) && now.getHours() >= NACHBESTELLUNG_REMINDER_HOUR;
  }

  function buildNachbestellungReminder(openCount) {
    const banner = document.createElement('div');
    banner.className = 'nachbestellung-reminder';

    const text = document.createElement('span');
    text.textContent =
      `⏰ Erinnerung: ${openCount} offene Nachbestellung${openCount === 1 ? '' : 'en'} – bitte prüfen und bearbeiten. ` +
      `(Erinnerung dienstags & freitags ab ${NACHBESTELLUNG_REMINDER_HOUR} Uhr, bis erledigt)`;
    banner.appendChild(text);

    const actionBtn = document.createElement('button');
    actionBtn.type = 'button';
    actionBtn.className = 'btn-gold-outline small';
    actionBtn.textContent = isAdmin ? '→ Zu den Nachbestellungen' : '🔒 Admin-Modus entsperren';
    actionBtn.addEventListener('click', () => {
      if (isAdmin) {
        const nbTable = content.querySelector('.admin-nb-table, .admin-nb-add-row');
        if (nbTable) nbTable.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        toggleAdminMode();
      }
    });
    banner.appendChild(actionBtn);

    return banner;
  }

  function buildAdminPanel() {
    const panel = document.createElement('div');
    panel.className = 'admin-panel';

    const heading = document.createElement('h2');
    heading.textContent = '🔓 Admin-Bereich';
    panel.appendChild(heading);

    const grid = document.createElement('div');
    grid.className = 'admin-grid';

    // --- Downloads für Admins ---
    const downloadsCard = document.createElement('div');
    downloadsCard.className = 'admin-card';
    const downloadsHeading = document.createElement('h3');
    downloadsHeading.textContent = '⬇ Alle Download-Versionen';
    downloadsCard.appendChild(downloadsHeading);
    const downloadsList = document.createElement('ul');
    downloadsList.className = 'admin-download-list';
    DOWNLOAD_LINKS.forEach((link) => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = link.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = link.label;
      li.appendChild(a);
      downloadsList.appendChild(li);
    });
    downloadsCard.appendChild(downloadsList);
    grid.appendChild(downloadsCard);

    // --- Nachbestellungen ---
    const nbCard = document.createElement('div');
    nbCard.className = 'admin-card';
    const nbHeading = document.createElement('h3');
    nbHeading.textContent = '📦 Nachbestellungen';
    nbCard.appendChild(nbHeading);

    const allNachbestellungen = [];
    state.inventar.forEach((item) => {
      (item.nachbestellungen || []).forEach((nb) => {
        allNachbestellungen.push({ item, nb });
      });
    });

    if (!allNachbestellungen.length) {
      const empty = document.createElement('p');
      empty.className = 'foto-status';
      empty.textContent = 'Noch keine Nachbestellungen angelegt.';
      nbCard.appendChild(empty);
    } else {
      const nbTable = document.createElement('table');
      nbTable.className = 'admin-nb-table';
      const thead = document.createElement('thead');
      thead.innerHTML = '<tr><th>Gerät</th><th>Menge</th><th>Status</th><th>Datum</th><th></th></tr>';
      nbTable.appendChild(thead);
      const tbody = document.createElement('tbody');
      allNachbestellungen.forEach(({ item, nb }) => {
        const tr = document.createElement('tr');

        const geraetTd = document.createElement('td');
        geraetTd.textContent = item.geraet;
        tr.appendChild(geraetTd);

        const mengeTd = document.createElement('td');
        mengeTd.textContent = String(nb.menge);
        tr.appendChild(mengeTd);

        const statusTd = document.createElement('td');
        const statusSelect = document.createElement('select');
        ['offen', 'bestellt', 'erledigt'].forEach((s) => {
          const opt = document.createElement('option');
          opt.value = s;
          opt.textContent = s.charAt(0).toUpperCase() + s.slice(1);
          if (s === nb.status) opt.selected = true;
          statusSelect.appendChild(opt);
        });
        statusSelect.addEventListener('change', () => updateNachbestellungStatus(item.id, nb.id, statusSelect.value));
        statusTd.appendChild(statusSelect);
        tr.appendChild(statusTd);

        const datumTd = document.createElement('td');
        datumTd.textContent = nb.datum;
        tr.appendChild(datumTd);

        const actionsTd = document.createElement('td');
        const delBtn = document.createElement('button');
        delBtn.className = 'icon-btn danger';
        delBtn.textContent = '✕';
        delBtn.title = 'Nachbestellung löschen';
        delBtn.addEventListener('click', () => deleteNachbestellung(item.id, nb.id));
        actionsTd.appendChild(delBtn);
        tr.appendChild(actionsTd);

        tbody.appendChild(tr);
      });
      nbTable.appendChild(tbody);
      nbCard.appendChild(nbTable);
    }

    const addRow = document.createElement('div');
    addRow.className = 'admin-nb-add-row';
    const geraetSelect = document.createElement('select');
    state.inventar.forEach((item) => {
      const opt = document.createElement('option');
      opt.value = item.id;
      opt.textContent = item.geraet + (item.hersteller ? ' (' + item.hersteller + ')' : '');
      geraetSelect.appendChild(opt);
    });
    const mengeInput = document.createElement('input');
    mengeInput.type = 'number';
    mengeInput.min = '1';
    mengeInput.value = '1';
    mengeInput.className = 'stueckzahl-input';
    const addBtn = document.createElement('button');
    addBtn.className = 'btn-gold-outline small';
    addBtn.textContent = '+ Nachbestellung anlegen';
    addBtn.disabled = !state.inventar.length;
    addBtn.addEventListener('click', () => {
      if (!geraetSelect.value) return;
      addNachbestellung(geraetSelect.value, mengeInput.value);
    });
    addRow.appendChild(geraetSelect);
    addRow.appendChild(mengeInput);
    addRow.appendChild(addBtn);
    nbCard.appendChild(addRow);

    grid.appendChild(nbCard);
    panel.appendChild(grid);

    return panel;
  }

  function updateStueckzahl(id, value) {
    const item = findInventarItem(id);
    if (!item) return;
    const val = Math.max(0, parseInt(value, 10) || 0);
    item.stueckzahl = val;
    persist();
    render();
  }

  function openAusgabeModal(id) {
    const item = findInventarItem(id);
    if (!item) return;
    pendingAusgabeId = id;
    ausgabeGeraetText.textContent = `${item.geraet}${item.hersteller ? ' (' + item.hersteller + ')' : ''} – aktueller Bestand: ${item.stueckzahl} Stück`;
    ausgabeMenge.value = '1';
    ausgabeMenge.max = String(item.stueckzahl || 1);
    ausgabeEmpfaenger.value = '';
    ausgabeModal.classList.add('visible');
    ausgabeMenge.focus();
  }

  function closeAusgabeModal() {
    pendingAusgabeId = null;
    ausgabeModal.classList.remove('visible');
  }

  function confirmAusgabe() {
    if (!pendingAusgabeId) return;
    const item = findInventarItem(pendingAusgabeId);
    if (!item) return;

    const menge = Math.max(1, parseInt(ausgabeMenge.value, 10) || 0);
    const empfaenger = ausgabeEmpfaenger.value.trim();
    const abgegeben = Math.min(menge, item.stueckzahl);

    item.stueckzahl -= abgegeben;
    item.ausgaben.push({
      id: uid(),
      menge: abgegeben,
      empfaenger: empfaenger || 'unbekannt',
      datum: new Date().toLocaleString('de-DE', {
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      })
    });
    persist();
    closeAusgabeModal();
    render();

    const wer = empfaenger ? ` an ${empfaenger}` : '';
    if (item.stueckzahl <= LOW_STOCK_THRESHOLD) {
      showToast(
        `⚠️ ${abgegeben}× "${item.geraet}" ausgegeben${wer}. Erinnerung: Nur noch ${item.stueckzahl} Stück auf Lager – Nachbestellung prüfen!`,
        'warning'
      );
    } else {
      showToast(`${abgegeben}× "${item.geraet}" ausgegeben${wer}. Restbestand: ${item.stueckzahl}.`);
    }
  }

  // ---- Mikrofon-Diktat ----

  function attachMic(button, input) {
    const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognitionCtor) {
      button.addEventListener('click', () => {
        showToast('Spracheingabe wird von diesem System nicht unterstützt.', 'warning');
      });
      return;
    }

    let recognition = null;
    let listening = false;

    button.addEventListener('click', () => {
      if (listening) {
        recognition && recognition.stop();
        return;
      }
      recognition = new SpeechRecognitionCtor();
      recognition.lang = 'de-DE';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        listening = true;
        button.classList.add('listening');
        button.textContent = '🎙️';
      };
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.trim();
        if (transcript) {
          input.value = transcript;
          input.focus();
        }
      };
      recognition.onerror = () => {
        showToast('Spracheingabe fehlgeschlagen. Bitte Mikrofonzugriff erlauben.', 'warning');
      };
      recognition.onend = () => {
        listening = false;
        button.classList.remove('listening');
        button.textContent = '🎤';
      };
      recognition.start();
    });
  }

  // ---- Foto-Erkennung ----

  const COCO_LABELS_DE = {
    laptop: 'Laptop',
    'cell phone': 'Smartphone',
    keyboard: 'Tastatur',
    mouse: 'Maus',
    tv: 'Bildschirm/TV',
    remote: 'Fernbedienung',
    book: 'Buch',
    clock: 'Uhr',
    scissors: 'Schere',
    cup: 'Tasse',
    bottle: 'Flasche',
    chair: 'Stuhl',
    backpack: 'Rucksack',
    handbag: 'Tasche',
    suitcase: 'Koffer',
    microwave: 'Mikrowelle',
    printer: 'Drucker'
  };

  function translateLabel(label) {
    return COCO_LABELS_DE[label] || label.charAt(0).toUpperCase() + label.slice(1);
  }

  function loadScriptOnce(src) {
    return new Promise((resolve, reject) => {
      if (document.querySelector(`script[src="${src}"]`)) {
        resolve();
        return;
      }
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('Skript konnte nicht geladen werden: ' + src));
      document.head.appendChild(s);
    });
  }

  let cocoModelPromise = null;
  async function ensureCocoModel() {
    if (!cocoModelPromise) {
      cocoModelPromise = (async () => {
        if (!window.tf) {
          await loadScriptOnce('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js');
        }
        if (!window.cocoSsd) {
          await loadScriptOnce('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js');
        }
        return window.cocoSsd.load();
      })().catch((err) => {
        cocoModelPromise = null;
        throw err;
      });
    }
    return cocoModelPromise;
  }

  async function startCamera() {
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
    } catch (err) {
      invFotoStatus.textContent = 'Kein Kamerazugriff möglich. Bitte Berechtigung erteilen.';
      return;
    }
    invCapturedPhoto.hidden = true;
    invRecognitionBox.hidden = true;
    invFotoStatus.textContent = '';
    invCameraPreview.srcObject = cameraStream;
    invCameraPreview.hidden = false;
    invCameraActions.hidden = false;
  }

  async function capturePhoto() {
    if (!cameraStream) return;
    const video = invCameraPreview;
    invCameraCanvas.width = video.videoWidth || 640;
    invCameraCanvas.height = video.videoHeight || 480;
    const ctx = invCameraCanvas.getContext('2d');
    ctx.drawImage(video, 0, 0, invCameraCanvas.width, invCameraCanvas.height);
    capturedPhotoDataUrl = invCameraCanvas.toDataURL('image/jpeg', 0.85);

    stopCamera();
    invCapturedPhoto.src = capturedPhotoDataUrl;
    invCapturedPhoto.hidden = false;

    await runRecognition(capturedPhotoDataUrl);
  }

  async function runRecognition(dataUrl) {
    invFotoStatus.textContent = 'Analysiere Foto...';
    invRecognitionBox.hidden = true;
    try {
      const model = await ensureCocoModel();
      const img = new Image();
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
        img.src = dataUrl;
      });
      const predictions = await model.detect(img);
      invFotoStatus.textContent = '';

      if (!predictions.length) {
        invFotoStatus.textContent = 'Kein Objekt erkannt. Bitte Gerät manuell eingeben.';
        return;
      }

      const best = predictions.reduce((a, b) => (b.score > a.score ? b : a));
      recognizedLabel = translateLabel(best.class);
      const confidence = Math.round(best.score * 100);
      invRecognitionText.textContent = `Erkannt: "${recognizedLabel}" (${confidence}% Sicherheit) – ist das richtig?`;
      invRecognitionBox.hidden = false;
    } catch (err) {
      invFotoStatus.textContent = 'Fotoerkennung nicht verfügbar (Internetverbindung erforderlich). Bitte manuell eingeben.';
    }
  }

  function render() {
    updateAdminToggleButton();

    content.innerHTML = '';

    const openNachbestellungen = countOpenNachbestellungen();
    if (openNachbestellungen > 0 && isNachbestellungReminderTime()) {
      content.appendChild(buildNachbestellungReminder(openNachbestellungen));
    }

    if (isAdmin) {
      content.appendChild(buildAdminPanel());
    }

    if (!state.inventar.length) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = `<p>Noch keine Geräte im Inventar erfasst.</p>`;
      const btn = document.createElement('button');
      btn.className = 'btn-gold';
      btn.textContent = '+ Neues Gerät';
      btn.addEventListener('click', openAddInventarModal);
      empty.appendChild(btn);
      content.appendChild(empty);
      return;
    }

    const table = document.createElement('table');
    table.className = 'inventar-table';

    const thead = document.createElement('thead');
    thead.innerHTML = `<tr>
      <th>Gerät</th>
      <th>Hersteller</th>
      <th>OVP/Gebraucht</th>
      <th>Stückzahl</th>
      <th>Aktionen</th>
    </tr>`;
    table.appendChild(thead);

    const tbody = document.createElement('tbody');

    state.inventar.forEach((item) => {
      const tr = document.createElement('tr');
      if (item.stueckzahl <= LOW_STOCK_THRESHOLD) tr.classList.add('low-stock');

      const geraetTd = document.createElement('td');
      geraetTd.className = 'geraet-cell';
      if (item.photo) {
        const thumb = document.createElement('img');
        thumb.className = 'geraet-thumb';
        thumb.src = item.photo;
        thumb.alt = item.geraet;
        geraetTd.appendChild(thumb);
      }
      const geraetName = document.createElement('span');
      geraetName.textContent = item.geraet;
      geraetTd.appendChild(geraetName);
      tr.appendChild(geraetTd);

      const herstellerTd = document.createElement('td');
      herstellerTd.textContent = item.hersteller || '–';
      tr.appendChild(herstellerTd);

      const zustandTd = document.createElement('td');
      const zustandBadge = document.createElement('span');
      zustandBadge.className = 'zustand-badge ' + (item.zustand === 'OVP' ? 'ovp' : 'gebraucht');
      zustandBadge.textContent = item.zustand;
      zustandTd.appendChild(zustandBadge);
      tr.appendChild(zustandTd);

      const stueckzahlTd = document.createElement('td');
      const stueckzahlInput = document.createElement('input');
      stueckzahlInput.type = 'number';
      stueckzahlInput.min = '0';
      stueckzahlInput.className = 'stueckzahl-input';
      stueckzahlInput.value = String(item.stueckzahl);
      stueckzahlInput.addEventListener('change', () => updateStueckzahl(item.id, stueckzahlInput.value));
      stueckzahlTd.appendChild(stueckzahlInput);
      if (item.stueckzahl <= LOW_STOCK_THRESHOLD) {
        const warn = document.createElement('span');
        warn.className = 'low-stock-badge';
        warn.textContent = '⚠️ Nachbestellen';
        stueckzahlTd.appendChild(warn);
      }
      tr.appendChild(stueckzahlTd);

      const actionsTd = document.createElement('td');
      actionsTd.className = 'actions-cell';
      const ausgebenBtn = document.createElement('button');
      ausgebenBtn.className = 'btn-gold-outline small';
      ausgebenBtn.textContent = 'Ausgeben';
      ausgebenBtn.disabled = item.stueckzahl <= 0;
      ausgebenBtn.addEventListener('click', () => openAusgabeModal(item.id));
      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn danger';
      delBtn.textContent = '✕';
      delBtn.title = 'Gerät löschen';
      delBtn.addEventListener('click', () => openDeleteInventarModal(item.id));
      actionsTd.appendChild(ausgebenBtn);
      actionsTd.appendChild(delBtn);
      tr.appendChild(actionsTd);

      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    content.appendChild(table);
  }

  addInventarBtn.addEventListener('click', openAddInventarModal);
  cancelAddInventarBtn.addEventListener('click', closeAddInventarModal);
  confirmAddInventarBtn.addEventListener('click', confirmAddInventar);

  attachMic(invGeraetMic, invGeraet);
  attachMic(invHerstellerMic, invHersteller);

  invStartCamera.addEventListener('click', startCamera);
  invCapturePhotoBtn.addEventListener('click', capturePhoto);
  invCancelCameraBtn.addEventListener('click', stopCamera);
  invRecognitionYesBtn.addEventListener('click', () => {
    if (recognizedLabel) invGeraet.value = recognizedLabel;
    invRecognitionBox.hidden = true;
    invStueckzahl.focus();
    invStueckzahl.select();
  });
  invRecognitionNoBtn.addEventListener('click', () => {
    invRecognitionBox.hidden = true;
    invGeraet.focus();
  });

  cancelAusgabeBtn.addEventListener('click', closeAusgabeModal);
  confirmAusgabeBtn.addEventListener('click', confirmAusgabe);

  cancelDeleteInventarBtn.addEventListener('click', closeDeleteInventarModal);
  confirmDeleteInventarBtn.addEventListener('click', confirmDeleteInventar);

  adminModeBtn.addEventListener('click', toggleAdminMode);
  cancelAdminPinBtn.addEventListener('click', closeAdminPinModal);
  confirmAdminPinBtn.addEventListener('click', confirmAdminPin);
  adminPinInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') confirmAdminPin();
  });

  async function init() {
    const loaded = await window.dashboardAPI.loadData();
    state = loaded && typeof loaded === 'object' ? loaded : { inventar: [] };
    if (!Array.isArray(state.inventar)) state.inventar = [];
    state.inventar.forEach((i) => {
      if (!Array.isArray(i.ausgaben)) i.ausgaben = [];
      if (!Array.isArray(i.nachbestellungen)) i.nachbestellungen = [];
    });
    render();
  }

  // Prüft minütlich, ob der Nachbestellungen-Reminder ein-/ausgeblendet werden muss
  // (z. B. beim Überschreiten von Dienstag/Freitag 10 Uhr), ohne bei unveränderter
  // Lage unnötig neu zu rendern.
  let lastReminderKey = null;
  setInterval(() => {
    const key = isNachbestellungReminderTime() + ':' + countOpenNachbestellungen();
    if (key !== lastReminderKey) {
      lastReminderKey = key;
      render();
    }
  }, 60000);

  init();
})();

</script>
  <script>
    document.getElementById('demoResetBtn').addEventListener('click', function () {
      localStorage.removeItem('inventarDashboardDemoState');
      location.reload();
    });
  </script>
</body>
</html>
