<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFE600">
<title>FitSpark – Dein Trainingscoach</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">FitSpark</div>

  <div class="music-selector" id="musicSelector">
    <button class="music-toggle" id="musicPlayBtn" aria-label="Musik abspielen/pausieren">▶</button>
    <div class="music-genres" role="tablist" aria-label="Musikrichtung">
      <button class="genre-btn active" data-genre="samba" role="tab" aria-selected="true">Samba</button>
      <button class="genre-btn" data-genre="lounge" role="tab" aria-selected="false">Lounge</button>
      <button class="genre-btn" data-genre="house" role="tab" aria-selected="false">House</button>
      <button class="genre-btn" data-genre="motivation" role="tab" aria-selected="false">Motivation</button>
    </div>
  </div>
</header>

<nav class="tabbar" id="tabbar">
  <button class="tab-btn active" data-tab="tasks">Tagesaufgaben</button>
  <button class="tab-btn" data-tab="plans">Trainingspläne</button>
</nav>

<main id="content"></main>

<!-- Schritt 1: Trainingsziel wählen -->
<div class="modal-overlay" id="goalModal">
  <div class="modal">
    <h2>Was ist dein Trainingsziel?</h2>
    <p class="modal-sub">Wähle ein Ziel für die heutige Einheit.</p>
    <div class="option-grid" id="goalOptions">
      <button class="option-card" data-goal="ausdauer">
        <span class="option-title">Ausdauertraining</span>
        <span class="option-desc">Kondition &amp; Herz-Kreislauf stärken</span>
      </button>
      <button class="option-card" data-goal="aufbau">
        <span class="option-title">Muskelaufbau</span>
        <span class="option-desc">Kraft &amp; Muskelmasse steigern</span>
      </button>
      <button class="option-card" data-goal="definition">
        <span class="option-title">Muskeln definieren</span>
        <span class="option-desc">Straffen &amp; Definition sichtbar machen</span>
      </button>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="goalCancelBtn">Abbrechen</button>
    </div>
  </div>
</div>

<!-- Schritt 2: Muskelpartien wählen -->
<div class="modal-overlay" id="muscleModal">
  <div class="modal">
    <h2>Welche Muskelpartien möchtest du heute trainieren?</h2>
    <p class="modal-sub">Mehrfachauswahl möglich.</p>
    <div class="chip-grid" id="muscleOptions"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="muscleBackBtn">Zurück</button>
      <button class="btn-primary" id="muscleStartBtn" disabled>Training starten</button>
    </div>
  </div>
</div>

<!-- Schritt 3: Freundliche Ansage -->
<div class="modal-overlay" id="startAnnounceModal">
  <div class="modal modal-announce">
    <p class="announce-text">Okay, lass uns beginnen!</p>
  </div>
</div>

<!-- Aufgabe/Trainingspartie hinzufügen -->
<div class="modal-overlay" id="addTaskModal">
  <div class="modal">
    <h2 id="addTaskTitle">Neue Aufgabe</h2>
    <input type="text" id="addTaskInput" class="text-input" placeholder="z. B. 2 Liter Wasser trinken" maxlength="120">
    <div class="modal-actions">
      <button class="btn-secondary" id="addTaskCancelBtn">Abbrechen</button>
      <button class="btn-primary" id="addTaskConfirmBtn">Hinzufügen</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/app.js"></script>
</body>
</html>
